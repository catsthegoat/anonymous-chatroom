<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pioneers Proxy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #08080f;
      color: #fff;
      font-family: Satoshi, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      gap: 20px;
    }
    h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; }
    p { color: rgba(255,255,255,0.4); font-size: 13px; }
    .search-bar {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 560px;
      padding: 0 20px;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: rgba(255,255,255,0.35); }
    input::placeholder { color: rgba(255,255,255,0.3); }
    button {
      padding: 12px 20px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #ddd; }
    .back {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      text-decoration: none;
    }
    #frame {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 999;
      background: #000;
    }
    #frame-bar {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 44px;
      background: rgba(8,8,15,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 1000;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
    }
    #frame-bar input {
      flex: 1;
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 8px;
    }
    #frame-bar button {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 8px;
    }
    #close-btn {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
    }
  </style>
</head>
<body>
  <a href="/" class="back">← Back to Pioneers</a>

  <div id="main">
    <h1>🔓 Pioneers Proxy</h1>
    <p>Browse any site anonymously through the proxy</p>
    <div class="search-bar">
      <input id="url-input" type="text" placeholder="Enter URL or search (e.g. google.com)" />
      <button onclick="goProxy()">Go</button>
    </div>
  </div>

  <div id="frame-bar">
    <button id="close-btn" onclick="closeFrame()">✕ Close</button>
    <input id="frame-url" type="text" placeholder="Enter URL..." onkeydown="if(event.key==='Enter') navigate(this.value)" />
    <button onclick="navigate(document.getElementById('frame-url').value)">Go</button>
  </div>
  <iframe id="frame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>

  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <script>
    async function registerSW() {
      if ("serviceWorker" in navigator) {
        try {
          await navigator.serviceWorker.register("/uv/uv.sw.js", { scope: __uv$config.prefix });
        } catch(e) {
          console.warn("SW registration failed:", e);
        }
      }
    }
    registerSW();

    function toURL(val) {
      val = val.trim();
      if (!val) return null;
      if (!val.includes(".") && !val.startsWith("http")) {
        return "https://www.google.com/search?q=" + encodeURIComponent(val);
      }
      if (!val.startsWith("http")) val = "https://" + val;
      return val;
    }

    function goProxy() {
      const raw = document.getElementById("url-input").value;
      const url = toURL(raw);
      if (!url) return;
      navigate(url);
    }

    function navigate(url) {
      url = toURL(url) || url;
      const encoded = __uv$config.prefix + __uv$config.encodeUrl(url);
      document.getElementById("frame").src = encoded;
      document.getElementById("frame").style.display = "block";
      document.getElementById("frame-bar").style.display = "flex";
      document.getElementById("frame").style.top = "44px";
      document.getElementById("frame").style.height = "calc(100% - 44px)";
      document.getElementById("frame-url").value = url;
      document.getElementById("main").style.display = "none";
    }

    function closeFrame() {
      document.getElementById("frame").style.display = "none";
      document.getElementById("frame-bar").style.display = "none";
      document.getElementById("main").style.display = "flex";
      document.getElementById("frame").src = "";
    }

    document.getElementById("url-input").addEventListener("keydown", e => {
      if (e.key === "Enter") goProxy();
    });
  </script>
</body>
</html>
