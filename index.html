                  <span className="pr-live-dot" />
                  <div className="pr-call-banner-faces">
                    {othersInCall.slice(0, 5).map(u => <Avatar key={u} name={u} size={24} />)}
                  </div>
                  <span className="pr-call-banner-text"><b>{othersInCall.slice(0, 2).join(', ')}{othersInCall.length > 2 ? ` +${othersInCall.length - 2}` : ''}</b> {othersInCall.length === 1 ? 'is' : 'are'} in a call</span>
                  <button className="pr-pill-btn solid" onClick={joinCurrentRoomCall}>Join</button>
                </div>
              )}

              {roomUsers.length > 0 && (
                <div className="pr-people">
                  {roomUsers.map(user => (
                    <div key={user} className={'pr-person' + (user === username ? ' me' : '')}>
                      <Avatar name={user} size={22} />
                      <span>{user}</span>
                      {user === currentRoomData?.owner && <span className="pr-crown" title="Owner"><IconCrown /></span>}
                      {roomCallUsers.includes(user) && <span className="pr-person-live" title="In call">{I.cam}</span>}
                      {user !== username && (
                        <button className="pr-person-btn" title={`Call ${user}`} onClick={() => startCallWith(user)}>{I.phone}</button>
                      )}
                      {isOwner && user !== username && (
                        <button className="pr-person-btn danger" title={`Remove ${user}`} onClick={() => kickUser(user)}><UserX /></button>
                      )}
                    </div>
                  ))}
                </div>
              )}

              <div className="pr-messages" ref={messagesBoxRef} onScroll={onMessagesScroll}>
                <div className="pr-messages-inner">
                  {messages.length === 0 && (
                    <div className="pr-empty-room">
                      <div className="nxc-logo-icon" style={{ width: 64, height: 64 }}>
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#000" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                      </div>
                      <h3>Welcome to {currentRoomData?.name || 'the room'}</h3>
                      <p>Say hi, drop a photo, or start a video call.</p>
                    </div>
                  )}

                  {messages.map((msg, i) => {
                    const prev = messages[i - 1];
                    const newDay = !prev || new Date(prev.timestamp).toDateString() !== new Date(msg.timestamp).toDateString();
                    const divider = newDay ? <div key={'d' + msg.id} className="pr-day"><span>{formatDay(msg.timestamp)}</span></div> : null;

                    if (msg.type === 'system') {
                      return <React.Fragment key={msg.id}>{divider}<div className="pr-system">{msg.text}</div></React.Fragment>;
                    }

                    const mine = msg.username === username;
                    const grouped = !newDay && prev && prev.type !== 'system' && prev.username === msg.username && msg.timestamp - prev.timestamp < 5 * 60e3 && !msg.replyTo;
                    const replyMsg = msg.replyTo ? getReplyMessage(msg.replyTo) : null;
                    const mentionsMe = typeof msg.text === 'string' && !mine && new RegExp(`@${username}\\b`, 'i').test(msg.text);
                    const reactions = msg.reactions ? Object.entries(msg.reactions).map(([e, u]) => [e, Array.isArray(u) ? u : Object.values(u || {})]).filter(([, u]) => u.length) : [];

                    return (
                      <React.Fragment key={msg.id}>
                        {divider}
                        <div className={'pr-msg' + (grouped ? ' grouped' : '') + (mentionsMe ? ' mention' : '') + (editingId === msg.id ? ' editing' : '')}>
                          <div className="pr-msg-gutter">
                            {grouped ? <span className="pr-msg-hover-time">{formatTime(msg.timestamp)}</span> : <Avatar name={msg.username} size={36} />}
                          </div>
                          <div className="pr-msg-body">
                            {replyMsg !== null && msg.replyTo && (
                              <div className="pr-reply-ref" onClick={() => { const el = document.getElementById('m-' + msg.replyTo); el && el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }}>
                                <span className="pr-reply-line" />
                                {replyMsg && <Avatar name={replyMsg.username} size={16} />}
                                <b style={{ color: replyMsg ? userColor(replyMsg.username) : undefined }}>{replyMsg ? replyMsg.username : ''}</b>
                                <span className="pr-reply-text">{previewText(replyMsg).slice(0, 90)}</span>
                              </div>
                            )}
                            {!grouped && (
                              <div className="pr-msg-head">
                                <span className="pr-msg-name" style={{ color: userColor(msg.username) }}>{msg.username}</span>
                                {msg.username === currentRoomData?.owner && <span className="pr-crown"><IconCrown /></span>}
                                <span className="pr-msg-time">{formatTime(msg.timestamp)}</span>
                              </div>
                            )}
                            <div id={'m-' + msg.id}>
                              {msg.type === 'snap' && msg.image ? (
                                <img src={msg.image} alt="Photo" className="pr-msg-image" loading="lazy" onClick={() => setLightbox(msg.image)} />
                              ) : msg.type === 'video' && msg.videoUrl ? (
                                <video src={msg.videoUrl} controls playsInline className="pr-msg-image" />
                              ) : editingId === msg.id ? (
                                <div className="pr-edit">
                                  <textarea autoFocus value={editText} onChange={e => setEditText(e.target.value)}
                                    onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEdit(); } if (e.key === 'Escape') setEditingId(null); }} />
                                  <div className="pr-edit-hint">Enter to save · Esc to cancel</div>
                                </div>
                              ) : (
                                <div className="pr-msg-text">{renderText(msg.text)}{msg.edited && <span className="pr-edited">(edited)</span>}</div>
                              )}
                            </div>
                            {reactions.length > 0 && (
                              <div className="pr-reactions">
                                {reactions.map(([emoji, users]) => (
                                  <button key={emoji} title={users.join(', ')} onClick={() => addReaction(msg.id, emoji)} className={'pr-reaction' + (users.includes(username) ? ' active' : '')}>
                                    <span>{emoji}</span><b>{users.length}</b>
                                  </button>
                                ))}
                              </div>
                            )}
                          </div>
                          <div className="pr-msg-actions">
                            {EMOJIS.slice(0, 3).map(e => <button key={e} onClick={() => addReaction(msg.id, e)} title={'React ' + e}>{e}</button>)}
                            <button onClick={() => setShowEmojiPicker(showEmojiPicker === msg.id ? null : msg.id)} title="More reactions"><Smile /></button>
                            <button onClick={() => { setReplyTo(msg); composerRef.current && composerRef.current.focus(); }} title="Reply">{I.reply}</button>
                            {mine && !msg.type && <button onClick={() => startEdit(msg)} title="Edit">{I.edit}</button>}
                            {(mine || isOwner) && <button className="danger" onClick={() => deleteMessage(msg)} title="Delete">{I.trash}</button>}
                          </div>
                          {showEmojiPicker === msg.id && (
                            <div className="pr-emoji-picker" onMouseLeave={() => setShowEmojiPicker(null)}>
                              {EMOJIS.map(emoji => (
                                <button key={emoji} onClick={() => { addReaction(msg.id, emoji); setShowEmojiPicker(null); }}>{emoji}</button>
                              ))}
                            </div>
                          )}
                        </div>
                      </React.Fragment>
                    );
                  })}
                  <div ref={messagesEndRef} style={{ height: 1 }} />
                </div>
              </div>

              <div className="pr-composer-wrap">
                {newBelow > 0 && (
                  <button className="pr-new-below" onClick={jumpToBottom}>{I.down} {newBelow} new message{newBelow > 1 ? 's' : ''}</button>
                )}
                <div className={'pr-typing' + (typingUsers.length ? ' show' : '')}>
                  {typingUsers.length > 0 && <>
                    <span className="pr-typing-dots"><i /><i /><i /></span>
                    <b>{typingUsers.slice(0, 3).join(', ')}</b>&nbsp;{typingUsers.length === 1 ? 'is' : 'are'} typing
                  </>}
                </div>

                {replyTo && (
                  <div className="pr-replying">
                    {I.reply}
                    <span>Replying to <b style={{ color: userColor(replyTo.username) }}>{replyTo.username}</b></span>
                    <span className="pr-reply-text">{previewText(replyTo).slice(0, 80)}</span>
                    <button className="pr-icon-btn" onClick={() => setReplyTo(null)}>{I.x}</button>
                  </div>
                )}

                {showImageInput && (
                  <div className="pr-link-input">
                    <input autoFocus value={imageUrl} onChange={e => setImageUrl(e.target.value)}
                      onKeyDown={e => { if (e.key === 'Enter') sendImageUrl(); if (e.key === 'Escape') setShowImageInput(false); }}
                      placeholder="Paste an image or GIF link (Giphy page links work too)…" />
                    {imageUrl && <img src={imageUrl} alt="" onError={e => e.target.style.display = 'none'} onLoad={e => e.target.style.display = ''} />}
                    <button className="pr-pill-btn solid" onClick={sendImageUrl}>Send</button>
                    <button className="pr-icon-btn" onClick={() => setShowImageInput(false)}>{I.x}</button>
                  </div>
                )}

                <div className="pr-composer">
                  <div className="pr-composer-tools">
                    <button className="pr-tool" title="Upload photo" onClick={() => fileInputRef.current && fileInputRef.current.click()}>{I.image}</button>
                    <button className="pr-tool" title="Take a snap" onClick={openSnapCamera}>{I.camera}</button>
                    <button className={'pr-tool' + (showImageInput ? ' on' : '')} title="Send image link / GIF" onClick={() => setShowImageInput(s => !s)}>{I.link}</button>
                    <input ref={fileInputRef} type="file" accept="image/*" multiple hidden onChange={e => { sendImageFiles(e.target.files); e.target.value = ''; }} />
                  </div>
                  <textarea
                    ref={composerRef}
                    rows={1}
                    autoFocus
                    value={message}
                    onChange={(e) => {
                      setMessage(e.target.value);
                      e.target.style.height = 'auto';
                      e.target.style.height = Math.min(e.target.scrollHeight, 160) + 'px';
                      if (e.target.value) updateTyping();
                    }}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing) { e.preventDefault(); sendMessage(); }
                      if (e.key === 'Escape' && replyTo) setReplyTo(null);
                      if (e.key === 'ArrowUp' && !message) {
                        const lastMine = [...messages].reverse().find(m => m.username === username && !m.type);
                        if (lastMine) { e.preventDefault(); startEdit(lastMine); }
                      }
                    }}
                    onPaste={(e) => {
                      const files = Array.from(e.clipboardData.files || []);
                      if (files.some(f => f.type.startsWith('image/'))) { e.preventDefault(); sendImageFiles(files); }
                    }}
                    placeholder={`Message ${currentRoomData?.name || ''}`}
                    className="pr-composer-input"
                  />
                  <button onClick={sendMessage} className={'pr-send' + (message.trim() ? ' ready' : '')} disabled={!message.trim()} title="Send (Enter)">
                    {I.send}
                  </button>
                </div>
              </div>

              {dragOver && <div className="pr-drop"><div>{I.image}<b>Drop to send</b></div></div>}
            </div>

            {showSnapCamera && (
              <div className="snap-camera-modal">
                <button onClick={closeSnapCamera} className="snap-close-btn"><IconX /></button>
                {!capturedSnap && !recordedVideo && (
                  <div className="pr-snap-modes">
                    <button className={captureMode === 'photo' ? 'on' : ''} onClick={() => !isRecording && setCaptureMode('photo')}>Photo</button>
                    <button className={captureMode === 'video' ? 'on' : ''} onClick={() => setCaptureMode('video')}>Video</button>
                  </div>
                )}
                <div className="snap-video-container">
                  {!capturedSnap && !recordedVideo ? (
                    <>
                      <video ref={snapVideoRef} autoPlay playsInline muted className="snap-video"
                        style={{ transform: isFrontCamera ? 'scaleX(-1)' : 'none' }} />
                      {isRecording && (
                        <div className="pr-rec-pill"><span />{Math.floor(recordingTime / 60)}:{(recordingTime % 60).toString().padStart(2, '0')} / 0:30</div>
                      )}
                      <div className="snap-controls">
                        <button onClick={flipCamera} className="snap-action-btn" title="Flip camera">{I.flip}</button>
                        {captureMode === 'photo' ? (
                          <button onClick={captureSnap} className="snap-capture-btn" title="Capture photo" />
                        ) : (
                          <button onClick={isRecording ? stopRecording : startRecording}
                            className={'snap-capture-btn' + (isRecording ? ' recording' : ' video')}
                            title={isRecording ? 'Stop recording' : 'Start recording'} />
                        )}
                        <div style={{ width: 50 }} />
                      </div>
                    </>
                  ) : (
                    <>
                      {capturedSnap && <img src={capturedSnap} className="snap-preview-image" alt="Captured snap" />}
                      {recordedVideo && <video src={recordedVideo} className="snap-preview-image" controls autoPlay loop playsInline />}
                      <div className="snap-controls">
                        <button onClick={retakeSnap} className="pr-pill-btn glass">Retake</button>
                        <button onClick={sendSnap} className="pr-pill-btn solid">{I.send}<span>Send {capturedSnap ? 'photo' : 'video'}</span></button>
                      </div>
                    </>
                  )}
                  <canvas ref={snapCanvasRef} style={{ display: 'none' }} />
                </div>
              </div>
            )}
          </>
        );
      }

      return null;
      };

      return (
        <>
          <div key={currentView} className="pr-view">{renderView()}</div>

          {showProfileModal && (
            <div className="nxc-overlay" onClick={() => setShowProfileModal(false)}>
              <div className="nxc-modal" onClick={e => e.stopPropagation()}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '14px', marginBottom: '20px' }}>
                  <Avatar name={username} size={52} />
                  <div>
                    <div style={{ fontSize: '17px', fontWeight: '700' }}>{username}</div>
                    <span className="nxc-badge nxc-badge-green"><span className="pr-online-dot" /> Online</span>
                  </div>
                </div>
                <div style={{ borderTop: '1px solid var(--nx-border)', paddingTop: '14px', fontSize: '13px', color: 'var(--nx-muted)', display: 'flex', flexDirection: 'column', gap: '6px' }}>
                  <div>Friends: <span style={{ color: 'var(--nx-text)' }}>{friends.length}</span></div>
                  <div>Pending requests: <span style={{ color: 'var(--nx-text)' }}>{friendRequests.length}</span></div>
                </div>
                <button className="nxc-btn-danger" style={{ width: '100%', marginTop: '16px' }} onClick={signOut}>Sign out</button>
              </div>
            </div>
          )}

          {showFriendsModal && (
            <div className="nxc-overlay" onClick={() => setShowFriendsModal(false)}>
              <div className="nxc-modal" style={{ maxWidth: '450px', width: '100%' }} onClick={e => e.stopPropagation()}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '18px' }}>
                  <h3 style={{ fontSize: '17px', fontWeight: '700', display: 'flex', alignItems: 'center', gap: '8px' }}>Friends {friendRequests.length > 0 && <span className="nxc-notif" style={{ position: 'static' }}>{friendRequests.length}</span>}</h3>
                  <button className="nxc-btn-icon" onClick={() => setShowFriendsModal(false)}><IconX /></button>
                </div>
                <div style={{ display: 'flex', gap: '8px', marginBottom: '14px' }}>
                  <input className="nxc-inp" style={{ flex: 1 }} type="text" value={addFriendInput} onChange={e => setAddFriendInput(e.target.value)} placeholder="Add by username..." onKeyDown={e => e.key === 'Enter' && sendFriendRequest(addFriendInput.trim())} />
                  <button className="nxc-btn-p nxc-btn-sm" onClick={() => sendFriendRequest(addFriendInput.trim())}>Add</button>
                </div>
                {addFriendMsg && <p style={{ fontSize: '13px', color: addFriendMsg.includes('sent') ? 'var(--nx-green)' : 'var(--nx-red)', marginBottom: '10px' }}>{addFriendMsg}</p>}
                {friendRequests.length > 0 && (
                  <div style={{ marginBottom: '14px' }}>
                    <div className="nxc-section-label">Pending Requests</div>
                    {friendRequests.map(r => (
                      <div key={r.from} className="nxc-friend-row">
                        <Avatar name={r.from} size={38} />
                        <div style={{ flex: 1 }}><div style={{ fontWeight: '600', fontSize: '14px' }}>{r.from}</div><div style={{ fontSize: '12px', color: 'var(--nx-muted)' }}>wants to be friends</div></div>
                        <button className="nxc-btn-success nxc-btn-sm" onClick={() => acceptFriend(r.from)}><IconCheck /></button>
                        <button className="nxc-btn-danger nxc-btn-sm" onClick={() => declineFriend(r.from)}><IconX /></button>
                      </div>
                    ))}
                  </div>
                )}
                <div className="nxc-section-label">Friends · {friends.length}</div>
                <div style={{ maxHeight: '50vh', overflowY: 'auto' }}>
                  {friends.length === 0 ? <p style={{ color: 'var(--nx-muted)', fontSize: '13px', textAlign: 'center', padding: '20px 0' }}>No friends yet. Add someone!</p> :
                    [...friends].sort((a, b) => (onlineUsers[b]?.online ? 1 : 0) - (onlineUsers[a]?.online ? 1 : 0)).map(f => (
                      <div key={f} className="nxc-friend-row">
                        <div style={{ position: 'relative' }}>
                          <Avatar name={f} size={38} />
                          {onlineUsers[f]?.online && <span className="nxc-online-dot" />}
                        </div>
                        <div style={{ flex: 1 }}><div style={{ fontWeight: '600', fontSize: '14px' }}>{f}</div><div style={{ fontSize: '12px', color: onlineUsers[f]?.online ? 'var(--nx-green)' : 'var(--nx-muted)' }}>{onlineUsers[f]?.online ? 'Online' : 'Offline'}</div></div>
                        {onlineUsers[f]?.online && <button className="pr-icon-btn glass" title={`Call ${f}`} onClick={() => { setShowFriendsModal(false); startCallWith(f); }}>{I.phone}</button>}
                        <button className="pr-icon-btn" title="Remove friend" onClick={() => removeFriend(f)}>{I.trash}</button>
                      </div>
                    ))}
                </div>
              </div>
            </div>
          )}

          <CallOverlay engine={engine} me={username} minimized={callMinimized} setMinimized={setCallMinimized} />
          <IncomingCall engine={engine} inCall={inCall} />
          <Lightbox src={lightbox} onClose={() => setLightbox(null)} />
          <Toasts toasts={toasts} />
          {booting && <div className="pr-boot"><div className="pr-spinner" /></div>}
        </>
      );
    }

    ReactDOM.render(<ChatroomApp />, document.getElementById('root'));
</script>





<div id="js-error" style="display:none;position:fixed;inset:0;z-index:9999;background:#0e0e12;color:#fff;align-items:center;justify-content:center;flex-direction:column;font-family:sans-serif;text-align:center;padding:24px">
  <div style="font-size:42px;margin-bottom:12px">Chatrooms</div>
  <div style="color:#f87171;font-size:16px;max-width:520px">Something went wrong while loading. Try refreshing the page.</div>
</div>
<script>
setTimeout(function(){
  var root = document.getElementById('root');
  if (root && !root.innerText.trim()) {
    var err = document.getElementById('js-error');
    if (err) err.style.display = 'flex';
  }
}, 9000);
</script>





</body>
</html>
