<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatrooms</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>


<style>

:root {
  --nx-bg: #08080f;
  --nx-s1: rgba(10,10,16,0.45);
  --nx-s2: rgba(20,20,28,0.45);
  --nx-s3: rgba(28,28,40,0.65);
  --nx-s4: #242433;
  --nx-border: rgba(255,255,255,0.06);
  --nx-border2: rgba(255,255,255,0.1);
  --nx-border3: rgba(255,255,255,0.18);
  --nx-accent: #ffffff;
  --nx-accent2: #e0e0e0;
  --nx-glow: rgba(255,255,255,0.15);
  --nx-text: #e2e2ee;
  --nx-muted: #6b6b88;
  --nx-faint: #2e2e42;
  --nx-green: #4ade80;
  --nx-red: #f87171;
  --nx-yellow: #e0e0e0;
  --nx-r: 12px;
  --nx-rsm: 8px;
  --nx-rlg: 18px;
  --nx-t: 0.18s cubic-bezier(0.16,1,0.3,1);
  --nx-font: 'Satoshi',-apple-system,BlinkMacSystemFont,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;}
body{font-family:var(--nx-font);background:transparent;color:var(--nx-text);min-height:100dvh;overflow-x:hidden;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--nx-faint);border-radius:99px;}
::selection{background:rgba(255,255,255,0.15);}

.nxc-mesh{display:none;}

.nxc-page-center{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;}

.nxc-card{background:rgba(8,8,15,0.32);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,0.14);border-radius:var(--nx-rlg);
  box-shadow:0 8px 40px rgba(0,0,0,0.3),0 1px 0 rgba(255,255,255,0.14) inset,0 0 32px rgba(255,255,255,0.03) inset;overflow:hidden;}

.nxc-logo-icon{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--nx-accent),var(--nx-accent2));
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
  box-shadow:0 0 40px var(--nx-glow);}
.nxc-brand{font-size:30px;font-weight:800;letter-spacing:-0.04em;
  background:linear-gradient(135deg,#fff 30%,var(--nx-accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.nxc-tabs{display:flex;border-bottom:1px solid var(--nx-border);}
.nxc-tab{flex:1;padding:12px;text-align:center;font-size:13px;font-weight:500;color:var(--nx-muted);cursor:pointer;
  border-bottom:2px solid transparent;transition:all var(--nx-t);}
.nxc-tab.active{color:var(--nx-accent);border-bottom-color:var(--nx-accent);}
.nxc-tab:hover:not(.active){color:var(--nx-text);}

.nxc-inp{width:100%;padding:11px 14px;background:var(--nx-s2);border:1px solid var(--nx-border2);
  border-radius:var(--nx-r);color:var(--nx-text);font-size:14px;font-family:var(--nx-font);
  outline:none;transition:border-color var(--nx-t),box-shadow var(--nx-t);}
.nxc-inp::placeholder{color:var(--nx-muted);}
.nxc-inp:focus{border-color:var(--nx-accent);box-shadow:0 0 0 3px var(--nx-glow);}

button{font-family:var(--nx-font);cursor:pointer;border:none;transition:all var(--nx-t)!important;}
button:hover{transform:translateY(-1px)!important;}
button:active{transform:scale(0.95)!important;}

.nxc-btn-p{background:var(--nx-accent);color:#fff;padding:11px 22px;border-radius:var(--nx-r);
  font-size:14px;font-weight:600;box-shadow:0 0 0 0 var(--nx-glow);}
.nxc-btn-p:hover{background:#e0e0e0;box-shadow:0 0 22px var(--nx-glow);}
.nxc-btn-g{background:transparent;color:var(--nx-muted);padding:11px 22px;border-radius:var(--nx-r);
  font-size:14px;font-weight:500;border:1px solid var(--nx-border2);}
.nxc-btn-g:hover{background:var(--nx-s2);color:var(--nx-text);}
.nxc-btn-sm{padding:7px 14px !important;font-size:13px !important;border-radius:var(--nx-rsm) !important;}
.nxc-btn-icon{background:var(--nx-s2);color:var(--nx-muted);width:36px;height:36px;border-radius:var(--nx-rsm);
  display:flex;align-items:center;justify-content:center;border:1px solid var(--nx-border);flex-shrink:0;}
.nxc-btn-icon:hover{background:var(--nx-s3);color:var(--nx-text);}
.nxc-btn-danger{background:rgba(248,113,113,0.1);color:var(--nx-red);border:1px solid rgba(248,113,113,0.18);
  padding:9px 16px;border-radius:var(--nx-rsm);font-size:13px;font-weight:500;}
.nxc-btn-danger:hover{background:rgba(248,113,113,0.18);}
.nxc-btn-success{background:rgba(74,222,128,0.1);color:var(--nx-green);border:1px solid rgba(74,222,128,0.18);
  padding:9px 16px;border-radius:var(--nx-rsm);font-size:13px;font-weight:500;}
.nxc-btn-success:hover{background:rgba(74,222,128,0.18);}

.nxc-nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:56px;background:rgba(14,14,18,0.9);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--nx-border);}
.nxc-nav-logo{font-size:17px;font-weight:700;letter-spacing:-0.03em;display:flex;align-items:center;gap:9px;}
.nxc-nav-dot{width:8px;height:8px;border-radius:50%;background:var(--nx-accent);box-shadow:0 0 10px var(--nx-accent);
  animation:nxdot 2.5s ease-in-out infinite;}
@keyframes nxdot{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.6);opacity:0.6;}}

.nxc-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--nx-accent),var(--nx-accent2));
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;cursor:pointer;
  box-shadow:0 0 12px var(--nx-glow);flex-shrink:0;}
.nxc-avatar-sm{width:38px;height:38px;font-size:15px;}

.nxc-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;
  background:var(--nx-s3);color:var(--nx-muted);border:1px solid var(--nx-border);}
.nxc-badge-green{color:var(--nx-green);border-color:rgba(74,222,128,0.2);background:rgba(74,222,128,0.08);}
.nxc-notif{background:var(--nx-red);color:#fff;width:16px;height:16px;border-radius:50%;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;position:absolute;top:-5px;right:-5px;}

.nxc-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:500;
  display:flex;align-items:center;justify-content:center;padding:20px;animation:nxfade 0.18s ease both;}
.nxc-modal{background:var(--nx-s1);border:1px solid var(--nx-border2);border-radius:var(--nx-rlg);padding:26px;
  width:100%;max-width:420px;box-shadow:0 16px 60px rgba(0,0,0,0.6);animation:nxpop 0.25s cubic-bezier(0.34,1.56,0.64,1) both;}

.nxc-lobby-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.nxc-room-card{background:var(--nx-s1);border:1px solid var(--nx-border);border-radius:var(--nx-r);padding:18px;
  cursor:default;position:relative;overflow:hidden;transition:all var(--nx-t);
  animation:nxpop 0.3s cubic-bezier(0.34,1.56,0.64,1) both;}
.nxc-room-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.04),transparent);
  opacity:0;transition:opacity var(--nx-t);}
.nxc-room-card:hover{border-color:var(--nx-border3);transform:translateY(-3px)!important;box-shadow:0 8px 28px rgba(0,0,0,0.35);}
.nxc-room-card:hover::before{opacity:1;}
.nxc-room-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--nx-accent),var(--nx-accent2));
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;}

.nxc-section-label{font-size:11px;font-weight:600;color:var(--nx-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}
.nxc-friend-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--nx-border);}
.nxc-friend-row:last-child{border-bottom:none;}
.nxc-online-dot{position:absolute;bottom:1px;right:1px;width:9px;height:9px;border-radius:50%;
  background:var(--nx-green);border:2px solid var(--nx-s1);box-shadow:0 0 6px var(--nx-green);}

.nxc-chat-bar{padding:12px 16px;border-top:1px solid var(--nx-border);background:var(--nx-s1);flex-shrink:0;}

.nxc-msg-bubble{transition:background var(--nx-t);border-radius:var(--nx-r);padding:6px 10px;
  animation:nxmsg 0.22s cubic-bezier(0.34,1.56,0.64,1) both;}
.nxc-msg-bubble:hover{background:var(--nx-s2);}

.nxc-error{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);color:var(--nx-red);
  padding:9px 14px;border-radius:var(--nx-r);font-size:13px;}

@keyframes nxfade{from{opacity:0;}to{opacity:1;}}
@keyframes nxpop{from{opacity:0;transform:translateY(16px) scale(0.95);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes nxmsg{from{opacity:0;transform:translateY(10px) scale(0.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.nxc-fade-in{animation:nxpop 0.3s cubic-bezier(0.34,1.56,0.64,1) both;}

/* ---- AI/call/snap/games/proxy/debug styles ---- */
@keyframes rainbow {
  0%   { box-shadow: 0 0 18px 4px #ff0080, 0 0 40px 8px rgba(255,0,128,0.4); border-color: #ff0080; }
  16%  { box-shadow: 0 0 18px 4px #ff8000, 0 0 40px 8px rgba(255,128,0,0.4); border-color: #ff8000; }
  33%  { box-shadow: 0 0 18px 4px #ffff00, 0 0 40px 8px rgba(255,255,0,0.4); border-color: #ffff00; }
  50%  { box-shadow: 0 0 18px 4px #00ff80, 0 0 40px 8px rgba(0,255,128,0.4); border-color: #00ff80; }
  66%  { box-shadow: 0 0 18px 4px #0080ff, 0 0 40px 8px rgba(0,128,255,0.4); border-color: #0080ff; }
  83%  { box-shadow: 0 0 18px 4px #8000ff, 0 0 40px 8px rgba(128,0,255,0.4); border-color: #8000ff; }
  100% { box-shadow: 0 0 18px 4px #ff0080, 0 0 40px 8px rgba(255,0,128,0.4); border-color: #ff0080; }
}
@keyframes rainbowBorder {
  0%   { border-color: #ff0080; }
  16%  { border-color: #ff8000; }
  33%  { border-color: #ffff00; }
  50%  { border-color: #00ff80; }
  66%  { border-color: #0080ff; }
  83%  { border-color: #8000ff; }
  100% { border-color: #ff0080; }
}
@keyframes gradientShift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.ai-fab {
  position: fixed; bottom: 140px; right: 20px;
  width: 60px; height: 60px; border-radius: 50%;
  background: #000; border: 2px solid #ff0080;
  font-size: 28px; cursor: pointer; z-index: 1001;
  display: flex; align-items: center; justify-content: center;
  animation: rainbow 2.5s linear infinite; transition: transform 0.2s;
}
.ai-fab:hover { transform: scale(1.12); }
.ai-panel {
  position: fixed; bottom: 20px; right: 20px;
  width: min(480px, calc(100vw - 40px));
  height: min(620px, calc(100vh - 40px));
  background: #0a0a0a; border: 2px solid #ff0080; border-radius: 20px;
  display: flex; flex-direction: column; z-index: 1002;
  animation: rainbowBorder 2.5s linear infinite;
  box-shadow: 0 0 40px rgba(255,0,128,0.3); overflow: hidden;
}
.ai-panel-header {
  padding: 14px 18px; background: #111;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid #222; font-weight: bold; font-size: 15px; flex-shrink: 0;
}
.ai-header-left { display: flex; align-items: center; gap: 10px; }
.ai-header-left span {
  background: linear-gradient(90deg,#ff0080,#8000ff,#0080ff,#00ff80,#ffff00,#ff0080);
  background-size: 300% 300%; animation: gradientShift 4s ease infinite;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 16px;
}
.ai-model-badge { font-size: 10px; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 2px 7px; color: #aaa; font-weight: normal; -webkit-text-fill-color: #aaa; }
.ai-header-btns { display: flex; gap: 6px; align-items: center; }
.ai-clear-btn, .ai-close-btn { background: transparent; border: none; color: #666; cursor: pointer; font-size: 14px; padding: 4px 7px; border-radius: 6px; transition: all 0.2s; }
.ai-clear-btn:hover { color: #ff4444; background: rgba(255,68,68,0.1); }
.ai-close-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
.ai-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.ai-messages::-webkit-scrollbar { width: 4px; }
.ai-messages::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
.ai-msg { padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.6; max-width: 88%; word-break: break-word; }
.ai-msg.user { background: #1a1a1a; border: 1px solid #333; align-self: flex-end; border-bottom-right-radius: 4px; }
.ai-msg.ai { background: #0a0a1a; border: 1px solid #00c8ff; align-self: flex-start; color: #e0f7ff; border-bottom-left-radius: 4px; }
.ai-msg img { max-width: 100%; border-radius: 10px; margin-top: 8px; display: block; }
.ai-typing-dots { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
.ai-typing-dots span { width: 7px; height: 7px; border-radius: 50%; background: #555; animation: typingDot 1.2s infinite; }
.ai-typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.ai-typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingDot {
  0%, 60%, 100% { transform: translateY(0); background: #555; }
  30% { transform: translateY(-5px); background: #00c8ff; }
}
.ai-preview-bar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: #111; border-top: 1px solid #1a1a1a; flex-shrink: 0; }
.ai-preview-bar img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid #333; }
.ai-preview-name { font-size: 12px; color: #aaa; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-remove-file { background: transparent; border: none; color: #ff4444; cursor: pointer; font-size: 18px; padding: 0 4px; }
.ai-toolbar { display: flex; gap: 6px; padding: 8px 14px 4px; flex-shrink: 0; }
.ai-attach-btn { background: #1a1a1a; border: 1px solid #333; color: #888; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.ai-attach-btn:hover { background: #2a2a2a; color: #fff; border-color: #555; }
.ai-input-row { display: flex; gap: 8px; padding: 10px 14px 14px; flex-shrink: 0; }
.ai-input { flex: 1; padding: 10px 14px; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s; }
.ai-input:focus { border-color: #00c8ff; }
.ai-send-btn { padding: 10px 18px; background: #fff; color: #000; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
.ai-send-btn:hover { background: #ddd; }
.ai-send-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
.ai-note { font-size: 11px; color: #444; text-align: center; padding: 0 14px 8px; flex-shrink: 0; }
.ai-note a { color: #00c8ff; }

.ai-mode-toggle { background:#1a1a1a; border:1px solid #333; color:#ccc; border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; margin-left:auto; }
.ai-mode-toggle span { opacity:0.6; }
.ai-mode-toggle .active { opacity:1; color:#00c8ff; }
.ai-img { max-width:100%; border-radius:10px; margin-top:8px; display:block; }



        .video-call-modal { animation: fadeIn 0.3s ease-out; }
        .incoming-call { animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes fadeIn {
          from { opacity: 0; transform: scale(0.97); }
          to   { opacity: 1; transform: scale(1); }
        }
        @keyframes slideUp {
          from { opacity: 0; transform: translate(-50%, calc(-50% + 30px)); }

    * {
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.15s ease, opacity 0.2s ease;
    }

    
    button {
      transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease, background-color 0.2s ease, opacity 0.2s ease !important;
    }
    button:hover { transform: scale(1.07) !important; }
    button:active { transform: scale(0.94) !important; }

    
    input, textarea {
      transition: border-color 0.2s ease, box-shadow 0.25s ease !important;
    }

    
    @keyframes msgSlideIn {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .message-bubble {
      animation: msgSlideIn 0.28s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    
    @keyframes cardPop {
      from { opacity: 0; transform: translateY(22px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .glow-border {
      animation: cardPop 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    
    @keyframes roomFadeIn {
      from { opacity: 0; transform: translateX(-16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    
    .emoji-picker {
      animation: cardPop 0.22s cubic-bezier(0.34,1.56,0.64,1) both !important;
      transform-origin: bottom right;
    }

    
    @keyframes reactionBounce {
      0%   { transform: scale(0.5); opacity: 0; }
      60%  { transform: scale(1.25); }
      100% { transform: scale(1); opacity: 1; }
    }
    .reaction {
      animation: reactionBounce 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
      transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), background 0.2s ease !important;
    }
    .reaction:hover { transform: scale(1.18) !important; }

    
    .incoming-call {
      animation: slideUp 0.4s cubic-bezier(0.34,1.56,0.64,1) both !important;
    }

    
    .debug-console {
      animation: debugSlide 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes debugSlide {
      from { opacity: 0; transform: translateX(40px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    
    .ai-panel {
      animation: aiPanelIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both !important;
      transform-origin: bottom right;
    }
    @keyframes aiPanelIn {
      from { opacity: 0; transform: scale(0.88) translateY(30px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    
    .ai-msg {
      animation: msgSlideIn 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    
    .ai-fab, .proxy-fab {
      transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease !important;
    }
    .ai-fab:hover, .proxy-fab:hover {
      transform: scale(1.15) rotate(-8deg) !important;
    }

    
    .minimized-window {
      animation: cardPop 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
      transition: width 0.3s ease, height 0.3s ease, bottom 0.3s ease, right 0.3s ease !important;
    }

    
    .video-call-modal {
      animation: fadeIn 0.3s ease both !important;
    }

    
    .reply-preview {
      animation: msgSlideIn 0.2s ease both;
    }

    
    .typing-indicator {
      animation: typingPulse 2s ease-in-out infinite;
    }
    @keyframes typingPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    
    .system-message {
      animation: fadeIn 0.4s ease both;
    }

    
    * { scroll-behavior: smooth; }

.pr-pill-btn.live { background: rgba(74,222,128,.12); border-color: rgba(74,222,128,.35); color: #86efac; }
.pr-pill-btn.live:hover { background: rgba(74,222,128,.2); }
.pr-pill-count { margin-left: 6px; background: var(--nx-red); color: #fff; border-radius: 99px; font-size: 10px; padding: 1px 6px; font-weight: 800; }
button.nxc-mini-pill { color: var(--nx-muted); font-family: inherit; }
button.nxc-mini-pill:hover { color: #fff; background: rgba(255,255,255,.08); }
.pr-live-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 0 rgba(74,222,128,.6); animation: prLive 1.8s ease-out infinite; flex-shrink: 0; }
@keyframes prLive { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,.55); } 100% { box-shadow: 0 0 0 9px rgba(74,222,128,0); } }
.pr-online-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80; margin-right: 6px; vertical-align: 1px; }

/* ---------- toasts ---------- */
.pr-toasts { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 30000; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; width: min(440px, calc(100vw - 32px)); }
.pr-toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 14px; font-size: 13.5px; font-weight: 500; color: #fff; background: var(--pr-glass-strong); border: 1px solid var(--pr-line-2); backdrop-filter: blur(20px); box-shadow: 0 12px 40px rgba(0,0,0,.45); animation: prToastIn .38s var(--pr-spring) both; max-width: 100%; cursor: default; }
.pr-toast span { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pr-toast.leaving { animation: prToastOut .25s var(--pr-ease) both; }
.pr-toast-error { border-color: rgba(255,77,94,.45); }
.pr-toast-error::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--pr-red); flex-shrink: 0; }
.pr-toast-success::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #4ade80; flex-shrink: 0; }
.pr-toast-msg { cursor: pointer; }
@keyframes prToastIn { from { opacity: 0; transform: translateY(-14px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes prToastOut { to { opacity: 0; transform: translateY(-10px) scale(.97); } }

/* =====================================================================
   Call screen
   ===================================================================== */
.pr-call { position: fixed; inset: 0; z-index: 10000; display: flex; background: radial-gradient(1200px 700px at 50% -10%, #17172a 0%, #07070c 60%); color: #fff; animation: prCallIn .42s var(--pr-ease) both; }
@keyframes prCallIn { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: none; } }
.pr-call-main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pr-call-top { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: linear-gradient(to bottom, rgba(0,0,0,.55), transparent); transition: opacity .35s ease, transform .35s var(--pr-ease); }
.pr-call-title { display: flex; align-items: center; gap: 10px; font-size: 14px; min-width: 0; }
.pr-call-title b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr-call-timer, .pr-call-count { font-size: 12px; color: rgba(255,255,255,.6); font-variant-numeric: tabular-nums; padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,.07); white-space: nowrap; }
.pr-call.idle .pr-call-top { opacity: 0; transform: translateY(-8px); }
.pr-call.idle .pr-controls { opacity: 0; transform: translate(-50%, 14px); }
.pr-call.idle { cursor: none; }

/* stage layouts */
.pr-stage { flex: 1; min-height: 0; padding: 64px 14px 96px; }
.pr-stage.grid { display: grid; gap: 10px; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-template-rows: repeat(var(--rows), minmax(0, 1fr)); }
.pr-stage.grid.waiting { grid-template-columns: minmax(0, 860px); justify-content: center; grid-template-rows: minmax(0, 1fr) auto; }
.pr-stage.duo { position: relative; display: flex; }
.pr-stage.duo .pr-stage-main { flex: 1; display: flex; }
.pr-self-pip { position: absolute; right: 26px; bottom: 108px; width: clamp(120px, 20vw, 240px); aspect-ratio: 4 / 3; z-index: 4; display: flex; animation: prPop .4s var(--pr-spring) both; }
.pr-self-pip .pr-tile { box-shadow: 0 16px 40px rgba(0,0,0,.55); }
.pr-stage.spotlight { display: flex; gap: 10px; }
.pr-stage.spotlight .pr-stage-main { flex: 1; min-width: 0; display: flex; }
.pr-filmstrip { width: 220px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.pr-filmstrip .pr-tile { aspect-ratio: 16 / 10; flex: none; }

.pr-waiting-note { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid var(--pr-line); animation: prRise .5s var(--pr-ease) .15s both; }
.pr-waiting-note b { display: block; font-size: 14px; }
.pr-waiting-note span { font-size: 12.5px; color: rgba(255,255,255,.55); }

/* tiles */
.pr-tile { position: relative; flex: 1; min-width: 0; min-height: 0; border-radius: 18px; overflow: hidden; background: #111119; border: 1px solid rgba(255,255,255,.06); animation: prPop .45s var(--pr-spring) both; transition: box-shadow .25s ease, border-color .25s ease; }
.pr-tile.speaking { border-color: rgba(255,255,255,.85); box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 0 36px rgba(255,255,255,.18); }
.pr-tile-video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
.pr-tile-avatar { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.06), transparent 60%); }
.pr-tile-avatar-ring { border-radius: 50%; padding: 5px; transition: box-shadow .2s ease; }
.pr-tile.speaking .pr-tile-avatar-ring { box-shadow: 0 0 0 3px rgba(255,255,255,.7), 0 0 40px rgba(255,255,255,.25); animation: prBreath 1.2s ease-in-out infinite; }
@keyframes prBreath { 50% { box-shadow: 0 0 0 6px rgba(255,255,255,.35), 0 0 50px rgba(255,255,255,.2); } }
.pr-tile-name { position: absolute; left: 10px; bottom: 10px; display: flex; align-items: center; gap: 6px; max-width: calc(100% - 20px); padding: 5px 10px; border-radius: 10px; font-size: 12.5px; font-weight: 600; background: rgba(0,0,0,.62); }
.pr-tile-name > span:not(.pr-tile-muted):not(.pr-tile-chip) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr-tile-muted { display: inline-flex; color: var(--pr-red); }
.pr-tile-muted svg { width: 14px; height: 14px; }
.pr-tile-chip { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 6px; border-radius: 6px; background: #fff; color: #000; font-weight: 800; }
.pr-tile-hand { position: absolute; top: 10px; left: 10px; font-size: 22px; animation: prWave 1.4s ease-in-out infinite; transform-origin: 70% 90%; }
@keyframes prWave { 0%, 60%, 100% { transform: rotate(0); } 15% { transform: rotate(-14deg); } 30% { transform: rotate(12deg); } 45% { transform: rotate(-8deg); } }
.pr-tile-status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; background: rgba(8,8,15,.55); backdrop-filter: blur(4px); }
.pr-tile-pin { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(0,0,0,.5); opacity: 0; }
.pr-tile:hover .pr-tile-pin, .pr-tile.pinned .pr-tile-pin { opacity: 1; }
.pr-tile-reaction { position: absolute; top: 50%; left: 50%; font-size: 64px; pointer-events: none; animation: prTileReact 1.6s var(--pr-ease) both; }
@keyframes prTileReact { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.4); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } 70% { opacity: 1; transform: translate(-50%, -60%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -90%) scale(.9); } }
.pr-tile.compact .pr-tile-name { left: 6px; bottom: 6px; font-size: 11px; padding: 3px 7px; }
.pr-tile.compact .pr-tile-reaction { font-size: 36px; }

/* floating reactions */
.pr-reaction-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }
.pr-float-emoji { position: absolute; bottom: 90px; display: flex; flex-direction: column; align-items: center; animation: prFloat 3.1s cubic-bezier(.2,.6,.3,1) both; }
.pr-float-emoji span { font-size: 40px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.4)); }
.pr-float-emoji small { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: rgba(0,0,0,.5); margin-top: 2px; }
@keyframes prFloat { 0% { opacity: 0; transform: translateY(20px) scale(.5); } 12% { opacity: 1; transform: translateY(0) scale(1.1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-55vh) translateX(20px) scale(.9); } }

/* control bar */
.pr-controls { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 7; display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 22px; background: rgba(14,14,20,.94); border: 1px solid var(--pr-line); box-shadow: 0 18px 50px rgba(0,0,0,.5); transition: opacity .35s ease, transform .35s var(--pr-ease); animation: prBarIn .5s var(--pr-spring) .1s backwards; max-width: calc(100vw - 20px); }
@keyframes prBarIn { from { opacity: 0; transform: translate(-50%, 30px); } }
.pr-ctl-wrap { position: relative; }
.pr-ctl { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 64px; height: 56px; border-radius: 16px; color: #fff; background: rgba(255,255,255,.06); }
.pr-ctl span { font-size: 10.5px; font-weight: 600; color: rgba(255,255,255,.7); white-space: nowrap; }
.pr-ctl:hover { background: rgba(255,255,255,.13); }
.pr-ctl.off { background: rgba(255,77,94,.16); color: #ff8a95; }
.pr-ctl.off span { color: #ff8a95; }
.pr-ctl.on { background: #fff; color: #000; }
.pr-ctl.on span { color: #000; }
.pr-ctl.end { background: var(--pr-red); width: 72px; }
.pr-ctl.end span { color: #fff; }
.pr-ctl.end:hover { background: #ff2f44; box-shadow: 0 0 26px rgba(255,77,94,.45); }
.pr-badge-dot { position: absolute; top: 5px; right: 9px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; background: var(--pr-red); color: #fff; font-size: 10px; font-weight: 800; font-style: normal; display: flex; align-items: center; justify-content: center; animation: prPop .3s var(--pr-spring) both; }

.pr-popover { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); background: var(--pr-glass-strong); border: 1px solid var(--pr-line-2); border-radius: 18px; backdrop-filter: blur(24px); box-shadow: 0 20px 50px rgba(0,0,0,.5); animation: prPopUp .28s var(--pr-spring) both; z-index: 10; }
@keyframes prPopUp { from { opacity: 0; transform: translate(-50%, 8px) scale(.94); } to { opacity: 1; transform: translate(-50%, 0); } }
.pr-react-menu { display: flex; gap: 2px; padding: 6px; }
.pr-react-menu button { font-size: 26px; width: 46px; height: 46px; border-radius: 12px; background: transparent; }
.pr-react-menu button:hover { background: rgba(255,255,255,.1); transform: translateY(-4px) scale(1.15) !important; }
.pr-home-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(700px, 100%); margin-top: 26px; }
.pr-home-action { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 16px; border-radius: 16px; text-align: left; color: #fff; background: rgba(255,255,255,.04); border: 1px solid var(--pr-line); }
.pr-home-action:hover { background: rgba(255,255,255,.08); border-color: var(--pr-line-2); }
.pr-home-action svg { width: 20px; height: 20px; margin-bottom: 4px; }
.pr-home-action b { font-size: 15px; }
.pr-home-action span { font-size: 12.5px; color: var(--nx-muted); }
.pr-home-action.primary { background: #fff; color: #000; border-color: #fff; }
.pr-home-action.primary span { color: rgba(0,0,0,.55); }
@media (max-width: 640px) { .pr-home-actions { grid-template-columns: 1fr; } }
.pr-effects-menu { width: 340px; max-width: calc(100vw - 20px); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.pr-fx-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: rgba(255,255,255,.5); margin-top: 4px; }
.pr-fx-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pr-fx { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid transparent; color: #fff; }
.pr-fx:hover { background: rgba(255,255,255,.1); }
.pr-fx.on { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.7); }
.pr-fx small { font-size: 10.5px; font-weight: 600; color: rgba(255,255,255,.75); }
.pr-fx-icon { font-size: 24px; line-height: 1; }
.pr-fx-swatch { width: 26px; height: 26px; border-radius: 50%; background: conic-gradient(from 200deg, #ff6b6b, #ffd166, #06d6a0, #4cc9f0, #9b5de5, #ff6b6b); box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); }
.pr-fx-note { font-size: 12px; color: rgba(255,255,255,.55); text-align: center; padding-top: 2px; }
.pr-device-menu { width: 300px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.pr-popover-title { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 14px; }
.pr-device-row { display: flex; flex-direction: column; gap: 5px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: rgba(255,255,255,.5); }
.pr-device-row select { width: 100%; padding: 9px 10px; border-radius: 10px; background: rgba(255,255,255,.06); border: 1px solid var(--pr-line-2); color: #fff; font-family: inherit; font-size: 13px; text-transform: none; letter-spacing: 0; outline: none; }
.pr-device-row select option { background: #15151f; }

/* in-call chat */
.pr-call-chat { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; background: rgba(12,12,18,.92); border-left: 1px solid var(--pr-line); animation: prSlideIn .35s var(--pr-ease) both; }
@keyframes prSlideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
.pr-call-chat-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 14px 18px; font-weight: 700; border-bottom: 1px solid var(--pr-line); }
.pr-call-chat-list { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.pr-call-chat-msg { animation: prRise .25s var(--pr-ease) both; }
.pr-call-chat-from { font-size: 12px; font-weight: 700; margin-top: 10px; margin-bottom: 2px; }
.pr-call-chat-text { font-size: 14px; line-height: 1.45; word-break: break-word; color: rgba(255,255,255,.9); }
.pr-call-chat-input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--pr-line); }
.pr-call-chat-input input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.06); border: 1px solid var(--pr-line); color: #fff; font-family: inherit; font-size: 14px; outline: none; }
.pr-call-chat-input input:focus { border-color: rgba(255,255,255,.35); }
.pr-empty { color: rgba(255,255,255,.4); font-size: 13px; text-align: center; margin: auto; padding: 20px; line-height: 1.5; }

/* outgoing call */
.pr-calling { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.pr-calling-bg { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); filter: blur(34px) brightness(.45) saturate(1.2); }
.pr-calling-card { position: relative; text-align: center; animation: prRise .5s var(--pr-ease) both; }
.pr-calling-card h2 { font-size: 30px; font-weight: 800; letter-spacing: -.03em; margin-top: 26px; }
.pr-calling-card p { color: rgba(255,255,255,.6); margin-top: 6px; font-size: 15px; }
.pr-dots i { font-style: normal; animation: prPulse 1.2s infinite; }
.pr-dots i:nth-child(2) { animation-delay: .2s; }
.pr-dots i:nth-child(3) { animation-delay: .4s; }
.pr-ripple { position: relative; display: inline-flex; border-radius: 50%; }
.pr-ripple::before, .pr-ripple::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); animation: prRipple 2.2s var(--pr-ease) infinite; }
.pr-ripple::after { animation-delay: 1.1s; }
@keyframes prRipple { from { transform: scale(1); opacity: .8; } to { transform: scale(1.9); opacity: 0; } }

/* minimized player */
.pr-mini { position: fixed; right: 18px; bottom: 18px; z-index: 9000; width: 300px; border-radius: 20px; overflow: hidden; background: rgba(14,14,20,.96); border: 1px solid var(--pr-line-2); box-shadow: 0 24px 60px rgba(0,0,0,.6); cursor: pointer; animation: prMiniIn .45s var(--pr-spring) both; }
@keyframes prMiniIn { from { opacity: 0; transform: translateY(24px) scale(.9); } to { opacity: 1; transform: none; } }
.pr-mini-stage { height: 168px; display: flex; padding: 6px 6px 0; }
.pr-mini-stage .pr-tile { border-radius: 14px; animation: none; }
.pr-mini-bar { display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 12px; cursor: default; }
.pr-mini-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; font-size: 13px; }
.pr-mini-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr-mini-timer { font-size: 11px; color: rgba(255,255,255,.55); font-variant-numeric: tabular-nums; }
.pr-mini-btn { width: 36px; height: 36px; border-radius: 11px; display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(255,255,255,.07); flex-shrink: 0; }
.pr-mini-btn svg { width: 17px; height: 17px; }
.pr-mini-btn:hover { background: rgba(255,255,255,.14); }
.pr-mini-btn.off { background: rgba(255,77,94,.18); color: #ff8a95; }
.pr-mini-btn.end { background: var(--pr-red); }

/* incoming call */
.pr-incoming { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 12000; width: min(420px, calc(100vw - 24px)); animation: prDrop .5s var(--pr-spring) both; }
@keyframes prDrop { from { opacity: 0; transform: translate(-50%, -40px) scale(.95); } to { opacity: 1; transform: translate(-50%, 0); } }
.pr-incoming-card { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 24px; background: var(--pr-glass-strong); border: 1px solid var(--pr-line-2); backdrop-filter: blur(28px); box-shadow: 0 24px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04) inset; }
.pr-ripple.small::before, .pr-ripple.small::after { border-width: 1.5px; }
.pr-incoming-text { flex: 1; min-width: 0; }
.pr-incoming-text b { display: block; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr-incoming-text span { font-size: 12.5px; color: rgba(255,255,255,.6); }
.pr-incoming-actions { display: flex; gap: 8px; }
.pr-round { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; }
.pr-round.decline { background: var(--pr-red); }
.pr-round.audio { background: rgba(255,255,255,.12); }
.pr-round.accept { background: #22c55e; animation: prRing 1.6s ease-in-out infinite; }
@keyframes prRing { 0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); } 50% { box-shadow: 0 0 0 10px rgba(34,197,94,0); } }

/* lightbox */
.pr-lightbox { position: fixed; inset: 0; z-index: 25000; background: rgba(0,0,0,.88); backdrop-filter: blur(14px); display: flex; align-items: center; justify-content: center; padding: 24px; animation: prFade .2s ease both; cursor: zoom-out; }
.pr-lightbox img { max-width: 100%; max-height: 100%; border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: prPop .35s var(--pr-spring) both; cursor: default; }
.pr-lightbox-close { position: absolute; top: 16px; right: 16px; }

/* =====================================================================
   Chat room
   ===================================================================== */
.pr-room { height: 100dvh; display: flex; flex-direction: column; position: relative; }
.pr-room-nav { gap: 12px; }
.pr-back { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(255,255,255,.06); border: 1px solid var(--pr-line); flex-shrink: 0; }
.pr-back:hover { background: rgba(255,255,255,.12); }
.pr-room-name { font-weight: 800; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr-room-sub { font-size: 11.5px; color: var(--nx-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pr-call-banner { display: flex; align-items: center; gap: 10px; padding: 9px 18px; background: linear-gradient(90deg, rgba(74,222,128,.1), rgba(74,222,128,.02)); border-bottom: 1px solid rgba(74,222,128,.18); animation: prBanner .4s var(--pr-ease) both; flex-shrink: 0; }
@keyframes prBanner { from { opacity: 0; transform: translateY(-100%); } to { opacity: 1; transform: none; } }
.pr-call-banner-faces { display: flex; }
.pr-call-banner-faces .pr-avatar { margin-left: -6px; box-shadow: 0 0 0 2px #0b0b12; }
.pr-call-banner-faces .pr-avatar:first-child { margin-left: 0; }
.pr-call-banner-text { flex: 1; font-size: 13px; color: rgba(255,255,255,.75); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.pr-people { display: flex; gap: 6px; padding: 8px 16px; overflow-x: auto; border-bottom: 1px solid var(--nx-border); background: rgba(8,8,15,.35); flex-shrink: 0; scrollbar-width: none; }
.pr-people::-webkit-scrollbar { display: none; }

<style>
#constellation-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}
body { background: #08080f !important; }
#root { position: relative; z-index: 1; }
</style>
<canvas id="constellation-canvas"></canvas>
<script>
window._cMouse = {x:-9999,y:-9999};
window.addEventListener('mousemove',function(e){window._cMouse.x=e.clientX;window._cMouse.y=e.clientY;});
window.addEventListener('mouseleave',function(){window._cMouse.x=-9999;window._cMouse.y=-9999;});
window.addEventListener('load', function startConstellation(){
  const canvas = document.getElementById('constellation-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [];
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  for(let i=0;i<100;i++){
    stars.push({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*0.9+0.2,
      vx:(Math.random()-0.5)*0.32, vy:(Math.random()-0.5)*0.32,
      opacity: Math.random()*0.4+0.3
    });
  }
  function draw(){
    if (document.body.classList.contains('pr-in-call') || document.hidden) { requestAnimationFrame(draw); return; }
    stars.forEach(s=>{ s.x+=s.vx; s.y+=s.vy; if(s.x<0||s.x>W)s.vx*=-1; if(s.y<0||s.y>H)s.vy*=-1; });
    ctx.clearRect(0,0,W,H);
    for(let i=0;i<stars.length;i++){
      for(let j=i+1;j<stars.length;j++){
        const dx=stars[i].x-stars[j].x, dy=stars[i].y-stars[j].y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<120){
          ctx.beginPath();
          ctx.moveTo(stars[i].x,stars[i].y);
          ctx.lineTo(stars[j].x,stars[j].y);
          ctx.strokeStyle=`rgba(255,255,255,${0.12*(1-d/120)})`;
          ctx.lineWidth=0.5;
          ctx.stroke();
        }
      }
    }
    stars.forEach(s=>{
      // Mouse repulsion
      const rdx = s.x - window._cMouse.x, rdy = s.y - window._cMouse.y;
      const rd = Math.sqrt(rdx*rdx+rdy*rdy);
      if(rd < 80 && rd > 0){
        const force = (80 - rd) / 80 * 1.5;
        s.x += (rdx/rd) * force;
        s.y += (rdy/rd) * force;
      }
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${s.opacity})`;
      ctx.fill();
    });
    // Mouse interaction lines
    const mx = window._cMouse.x, my = window._cMouse.y;
    if(mx > -9000){
      stars.forEach(s=>{
        const dx=mx-s.x, dy=my-s.y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<160){
          ctx.beginPath();
          ctx.moveTo(mx,my);
          ctx.lineTo(s.x,s.y);
          ctx.strokeStyle=`rgba(255,255,255,${0.4*(1-d/160)})`;
          ctx.lineWidth=0.8;
          ctx.stroke();
        }
      });
    }
    requestAnimationFrame(draw);
  }
  draw();
});
</script>

    const fileToDataUrl = (file, max = 1280, quality = 0.82) => new Promise((resolve, reject) => {
      if (file.type === 'image/gif' && file.size < 1.5e6) {
        const r = new FileReader();
        r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(file);

      x: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
      send: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
      image: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>,
      link: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>,
      camera: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>,
      reply: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>,
      edit: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>,
      trash: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
      down: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>,
    };

    const CALL_REACTIONS = ['👍', '❤️', '😂', '😮', '👏', '🎉', '🔥', '💀'];

    const StreamVideo = ({ stream, mirror, className, fit = 'cover' }) => {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        el.muted = true;
        if (el.srcObject !== stream) el.srcObject = stream || null;
        if (stream) el.play().catch(() => {});
      }, [stream]);
      return <video ref={ref} autoPlay playsInline muted className={className}
        style={{ objectFit: fit, transform: mirror ? 'scaleX(-1)' : 'none' }} />;
    };

    // Remote audio lives in its own element so tiles can re-layout without cutting sound.
    const StreamAudio = ({ stream, sinkId }) => {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        if (el.srcObject !== stream) el.srcObject = stream || null;
        if (stream) el.play().catch(() => {});
      }, [stream]);
      useEffect(() => {
        const el = ref.current;
        if (el && sinkId && el.setSinkId) el.setSinkId(sinkId).catch(() => {});
      }, [sinkId]);
      return <audio ref={ref} autoPlay />;
    };

    const Avatar = ({ name, size = 36, className = '' }) => (
      <div className={'pr-avatar ' + className} style={{ width: size, height: size, fontSize: Math.round(size * 0.42), '--hue': userHue(name) }}>
        {(name || '?').charAt(0).toUpperCase()}
      </div>
    );

    /* =====================================================================
       Toasts (replace alert())
       ===================================================================== */

    function useToasts() {
      const [toasts, setToasts] = useState([]);
      const notify = React.useCallback((text, type = 'info', opts = {}) => {
        const id = newId();
        setToasts(t => [...t.slice(-3), { id, text, type, ...opts }]);
        setTimeout(() => setToasts(t => t.map(x => x.id === id ? { ...x, leaving: true } : x)), (opts.ms || 3800) - 250);
        setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), opts.ms || 3800);
      }, []);
      return [toasts, notify];
    }

    const Toasts = ({ toasts }) => (
      <div className="pr-toasts">
        {toasts.map(t => (
          <div key={t.id} className={`pr-toast pr-toast-${t.type}${t.leaving ? ' leaving' : ''}`} onClick={t.onClick}>
            {t.from && <Avatar name={t.from} size={24} />}
            <span>{t.text}</span>
          </div>
        ))}
      </div>
    );

    /* =====================================================================
       Video effects: color filters + face stickers.
       - Color filters run as a tiny WebGL shader (works in every browser, incl. Safari).
       - Face tracking runs in a background Web Worker on a small 320px frame,
         so turning an effect on never freezes the page.
       - Stickers glide toward the latest face position every frame, so they
         stay smooth even though tracking runs ~15x/sec.
       Nothing runs unless an effect is picked.
       ===================================================================== */

    // `css` is only used for the little preview swatch in the menu.
    const COLOR_FILTERS = [
      { id: 'none', label: 'None', css: 'none' },
      { id: 'bw', label: 'B&W', css: 'grayscale(1) contrast(1.15)' },
      { id: 'vintage', label: 'Vintage', css: 'sepia(.7) contrast(1.05) brightness(1.05)' },
      { id: 'warm', label: 'Warm', css: 'sepia(.35) saturate(1.5) hue-rotate(-12deg)' },
      { id: 'cool', label: 'Cool', css: 'saturate(1.1) hue-rotate(30deg) brightness(1.05)' },
      { id: 'vivid', label: 'Vivid', css: 'saturate(1.8) contrast(1.12)' },
      { id: 'noir', label: 'Noir', css: 'grayscale(1) contrast(1.7) brightness(.9)' },
      { id: 'dreamy', label: 'Dreamy', css: 'saturate(1.3) brightness(1.12) contrast(.85)' },
    ];
    const FACE_EFFECTS = [
      { id: 'none', label: 'None', icon: '🚫' },
      { id: 'cat', label: 'Cat', icon: '🐱' },
      { id: 'dog', label: 'Dog', icon: '🐶' },
      { id: 'shades', label: 'Shades', icon: '😎' },
      { id: 'crown', label: 'Crown', icon: '👑' },
      { id: 'clown', label: 'Clown', icon: '🤡' },
      { id: 'stache', label: 'Stache', icon: '🥸' },
    ];
    const effectsActive = (e) => !!e && ((e.color && e.color !== 'none') || (e.face && e.face !== 'none'));

    /* ---------- color: 3x3 matrix + offset, applied on the GPU ---------- */
    const LUM = [0.2126, 0.7152, 0.0722];
    const mIdentity = () => [1, 0, 0, 0, 1, 0, 0, 0, 1];
    const mMul = (a, b) => { const r = []; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) r.push(a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j]); return r; };
    const mSat = (s) => { const r = []; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) r.push((1 - s) * LUM[j] + (i === j ? s : 0)); return r; };
    const mMix = (a, b, t) => a.map((v, i) => v * (1 - t) + b[i] * t);
    const SEPIA = [0.393, 0.769, 0.189, 0.349, 0.686, 0.168, 0.272, 0.534, 0.131];
    // Builds { m, b } so that out = m * rgb + b, with contrast/brightness folded in.
    const grade = (m, { contrast = 1, bright = 0, offset = [0, 0, 0] } = {}) => ({
      m: m.map(v => v * contrast),
      b: offset.map(o => o + 0.5 * (1 - contrast) + bright),
    });
    const COLOR_GRADES = {
      bw: grade(mSat(0), { contrast: 1.15 }),
      vintage: grade(mMix(mIdentity(), SEPIA, 0.7), { contrast: 1.05, bright: 0.03 }),
      warm: grade([1.15, 0.05, 0, 0.02, 1.03, 0, 0, 0, 0.8], { offset: [0.04, 0.015, -0.03] }),
      cool: grade([0.85, 0, 0.02, 0, 1.0, 0.04, 0, 0.05, 1.2], { offset: [-0.03, 0.01, 0.06] }),
      vivid: grade(mSat(1.8), { contrast: 1.12 }),
      noir: grade(mSat(0), { contrast: 1.7, bright: -0.06 }),
      dreamy: grade(mMul(mSat(1.3), mIdentity()), { contrast: 0.85, bright: 0.09, offset: [0.02, 0, 0.03] }),
    };

    function createColorGL() {
      try {
        const c = document.createElement('canvas');
        const gl = c.getContext('webgl', { premultipliedAlpha: false, antialias: false, preserveDrawingBuffer: true });
        if (!gl) return null;
        const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
        const prog = gl.createProgram();
        gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 p;varying vec2 uv;void main(){uv=(p+1.0)*0.5;gl_Position=vec4(p,0.0,1.0);}'));
        gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, 'precision mediump float;varying vec2 uv;uniform sampler2D t;uniform mat3 m;uniform vec3 b;void main(){vec3 c=texture2D(t,uv).rgb;gl_FragColor=vec4(clamp(m*c+b,0.0,1.0),1.0);}'));
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
        gl.useProgram(prog);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        const loc = gl.getAttribLocation(prog, 'p');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
        [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR));
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        const uM = gl.getUniformLocation(prog, 'm'), uB = gl.getUniformLocation(prog, 'b');
        return {
          canvas: c,
          draw(source, w, h, g) {
            if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
            gl.viewport(0, 0, w, h);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, source);
            // GLSL mat3 is column-major, our matrices are row-major.
            const m = g.m;
            gl.uniformMatrix3fv(uM, false, [m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]]);
            gl.uniform3fv(uB, g.b);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          },
        };
      } catch (e) { return null; }
    }

    /* ---------- face tracking in a background worker ---------- */
    const MP_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const FACE_MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
    const FACE_KEYS = [0, 1, 2, 10, 33, 133, 234, 263, 362, 454];

    const FACE_WORKER_SRC = `
      let lm = null;
      onmessage = async (e) => {
        const m = e.data;
        if (m.type === 'init') {
          try {
            // Classic worker + CommonJS bundle, because MediaPipe loads its wasm with importScripts.
            const code = await (await fetch(m.base + '/vision_bundle.cjs')).text();
            const module = { exports: {} };
            new Function('module', 'exports', code)(module, module.exports);
            const vision = module.exports;
            const files = await vision.FilesetResolver.forVisionTasks(m.base + '/wasm');
            const make = (delegate) => vision.FaceLandmarker.createFromOptions(files, {
              baseOptions: { modelAssetPath: m.model, delegate },
              ...(delegate === 'GPU' && typeof OffscreenCanvas !== 'undefined' ? { canvas: new OffscreenCanvas(1, 1) } : {}),
              runningMode: 'VIDEO', numFaces: 1,
            });
            try { lm = await make('GPU'); } catch (err) { lm = await make('CPU'); }
            postMessage({ type: 'ready' });
          } catch (err) { postMessage({ type: 'error', message: String((err && err.message) || err) }); }
        } else if (m.type === 'frame') {
          let pts = null;
          const t0 = performance.now();
          try {
            const r = lm.detectForVideo(m.bitmap, m.ts);
            const f = r.faceLandmarks && r.faceLandmarks[0];
            if (f) pts = m.keys.map(k => [f[k].x, f[k].y]);
          } catch (err) {}
          m.bitmap.close && m.bitmap.close();
          postMessage({ type: 'result', pts, ms: performance.now() - t0 });
        }
      };`;

    // One shared tracker for the page; started the first time someone picks a face effect.
    let faceTracker = null;
    const getFaceTracker = () => {
      if (faceTracker) return faceTracker;
      let resolveReady, rejectReady;
      const ready = new Promise((res, rej) => { resolveReady = res; rejectReady = rej; });
      let worker = null, onResult = null;
      try {
        worker = new Worker(URL.createObjectURL(new Blob([FACE_WORKER_SRC], { type: 'text/javascript' })));
        worker.onmessage = (e) => {
          const m = e.data;
          if (m.type === 'ready') resolveReady();
          else if (m.type === 'error') { rejectReady(new Error(m.message)); faceTracker = null; }
          else if (m.type === 'result' && onResult) onResult(m);
        };
        worker.onerror = (e) => { rejectReady(new Error(e.message || 'worker failed')); faceTracker = null; };
        worker.postMessage({ type: 'init', base: MP_BASE, model: FACE_MODEL_URL });
      } catch (e) { rejectReady(e); }
      faceTracker = {
        ready,
        detect(bitmap, ts, cb) { onResult = cb; worker.postMessage({ type: 'frame', bitmap, ts, keys: FACE_KEYS }, [bitmap]); },
      };
      ready.catch(() => {});
      return faceTracker;
    };

    // Worker timers keep ticking when the tab is in the background (page timers get throttled).
    let tickWorkerUrl = null;
    const makeTicker = (fps, fn) => {
      try {
        if (!tickWorkerUrl) tickWorkerUrl = URL.createObjectURL(new Blob(['let t=null;onmessage=e=>{clearInterval(t);if(e.data>0)t=setInterval(()=>postMessage(0),e.data)}'], { type: 'text/javascript' }));
        const w = new Worker(tickWorkerUrl);
        w.onmessage = fn;
        w.postMessage(Math.round(1000 / fps));
        return () => { w.postMessage(0); w.terminate(); };
      } catch (e) {
        const t = setInterval(fn, Math.round(1000 / fps));
        return () => clearInterval(t);
      }
    };

    const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    function drawSticker(ctx, face, p) {
      const eyeL = mid(p[33], p[133]), eyeR = mid(p[362], p[263]);
      const ang = Math.atan2(eyeR.y - eyeL.y, eyeR.x - eyeL.x);
      const fw = dist(p[234], p[454]);
      const ed = dist(eyeL, eyeR);
      const at = (pt, fn) => { ctx.save(); ctx.translate(pt.x, pt.y); ctx.rotate(ang); fn(); ctx.restore(); };
      const rrect = (x, y, w, h, r) => { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); };
      const tri = (a, b, c, fill) => { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); };

      if (face === 'cat') {
        at(p[10], () => {
          for (const s of [-1, 1]) {
            tri([s * 0.1 * fw, -0.02 * fw], [s * 0.46 * fw, 0.04 * fw], [s * 0.36 * fw, -0.5 * fw], '#2a2a33');
            tri([s * 0.18 * fw, -0.05 * fw], [s * 0.39 * fw, -0.01 * fw], [s * 0.34 * fw, -0.37 * fw], '#ff9ec4');
          }
        });
        at(p[1], () => {
          tri([-0.05 * fw, -0.03 * fw], [0.05 * fw, -0.03 * fw], [0, 0.03 * fw], '#ff7fb0');
          ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = Math.max(1, 0.008 * fw); ctx.lineCap = 'round';
          for (const s of [-1, 1]) for (const dy of [-0.03, 0.02, 0.07]) {
            ctx.beginPath(); ctx.moveTo(s * 0.1 * fw, dy * fw); ctx.lineTo(s * 0.38 * fw, (dy * 1.8 - 0.01) * fw); ctx.stroke();
          }
        });
      } else if (face === 'dog') {
        at(p[10], () => {
          for (const s of [-1, 1]) {
            ctx.save(); ctx.translate(s * 0.5 * fw, -0.28 * fw); ctx.rotate(s * 0.28);
            ctx.beginPath(); ctx.ellipse(0, 0.2 * fw, 0.13 * fw, 0.3 * fw, 0, 0, Math.PI * 2); ctx.fillStyle = '#7a4a2a'; ctx.fill();
            ctx.beginPath(); ctx.ellipse(0, 0.24 * fw, 0.08 * fw, 0.22 * fw, 0, 0, Math.PI * 2); ctx.fillStyle = '#5c371f'; ctx.fill();
            ctx.restore();
          }
        });
        at(p[1], () => {
          ctx.beginPath(); ctx.ellipse(0, 0, 0.13 * fw, 0.085 * fw, 0, 0, Math.PI * 2); ctx.fillStyle = '#141414'; ctx.fill();
          ctx.beginPath(); ctx.ellipse(-0.04 * fw, -0.03 * fw, 0.035 * fw, 0.02 * fw, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fill();
        });
      } else if (face === 'shades') {
        at(mid(eyeL, eyeR), () => {
          const lw = ed * 0.66, lh = ed * 0.44;
          ctx.lineWidth = lh * 0.12; ctx.strokeStyle = '#0b0b0b';
          ctx.beginPath(); ctx.moveTo(-ed / 2 + lw / 2, -lh * 0.15); ctx.quadraticCurveTo(0, -lh * 0.45, ed / 2 - lw / 2, -lh * 0.15); ctx.stroke();
          for (const s of [-1, 1]) {
            ctx.beginPath(); ctx.moveTo(s * (ed / 2 + lw / 2), -lh * 0.25); ctx.lineTo(s * 0.5 * fw, -lh * 0.35); ctx.stroke();
            const g = ctx.createLinearGradient(0, -lh / 2, 0, lh / 2);
            g.addColorStop(0, '#2b2b36'); g.addColorStop(1, '#050507');
            rrect(s * ed / 2 - lw / 2, -lh / 2, lw, lh, lh * 0.38); ctx.fillStyle = g; ctx.fill(); ctx.stroke();
            ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = lh * 0.07;
            ctx.beginPath(); ctx.moveTo(s * ed / 2 - lw * 0.25, -lh * 0.1); ctx.lineTo(s * ed / 2 - lw * 0.05, -lh * 0.3); ctx.stroke();
            ctx.restore();
          }
        });
      } else if (face === 'crown') {
        // Drawn by hand (not an emoji) so it looks the same on every device.
        at(p[10], () => {
          const W = 0.62 * fw, H = 0.36 * fw, y0 = -0.08 * fw;
          const g = ctx.createLinearGradient(0, y0 - H, 0, y0);
          g.addColorStop(0, '#ffe680'); g.addColorStop(0.55, '#f5b700'); g.addColorStop(1, '#c98a00');
          ctx.beginPath();
          ctx.moveTo(-W / 2, y0);
          ctx.lineTo(-W / 2, y0 - H * 0.55);
          ctx.lineTo(-W * 0.26, y0 - H * 0.28);
          ctx.lineTo(0, y0 - H);
          ctx.lineTo(W * 0.26, y0 - H * 0.28);
          ctx.lineTo(W / 2, y0 - H * 0.55);
          ctx.lineTo(W / 2, y0);
          ctx.closePath();
          ctx.fillStyle = g; ctx.fill();
          ctx.lineWidth = Math.max(1, 0.012 * fw); ctx.strokeStyle = '#9c6b00'; ctx.stroke();
          rrect(-W / 2, y0 - H * 0.16, W, H * 0.16, H * 0.04); ctx.fillStyle = '#d99a00'; ctx.fill();
          [[-W / 2, y0 - H * 0.55, '#ff4d6d'], [0, y0 - H, '#4cc9f0'], [W / 2, y0 - H * 0.55, '#ff4d6d']].forEach(([x, y, c]) => {
            ctx.beginPath(); ctx.arc(x, y, 0.035 * fw, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill();
          });
          [-W * 0.28, 0, W * 0.28].forEach(x => { ctx.beginPath(); ctx.arc(x, y0 - H * 0.08, 0.028 * fw, 0, Math.PI * 2); ctx.fillStyle = x ? '#7bdff2' : '#ff4d6d'; ctx.fill(); });
        });
      } else if (face === 'clown') {
        at(p[1], () => {
          const r = 0.1 * fw;
          const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
          g.addColorStop(0, '#ff8a8a'); g.addColorStop(0.45, '#ee1c24'); g.addColorStop(1, '#9b0d12');
          ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
        });
      } else if (face === 'stache') {
        at(mid(p[2], p[0]), () => {
          const W = 0.34 * fw, H = 0.09 * fw;
          ctx.fillStyle = '#2b1a10';
          for (const s of [1, -1]) {
            ctx.save(); ctx.scale(s, 1);
            ctx.beginPath();
            ctx.moveTo(0, -H * 0.35);
            ctx.bezierCurveTo(W * 0.25, -H * 1.1, W * 0.55, -H * 0.7, W * 0.66, -H * 0.1);
            ctx.bezierCurveTo(W * 0.78, H * 0.35, W * 0.95, H * 0.15, W, -H * 0.45);
            ctx.bezierCurveTo(W * 0.98, H * 1.1, W * 0.5, H * 1.25, 0, H * 0.35);
            ctx.closePath(); ctx.fill();
            ctx.restore();
          }
        });
      }
    }

    function createEffectsProcessor({ onTooSlow }) {
      const video = document.createElement('video');
      video.muted = true; video.playsInline = true; video.autoplay = true;
      const canvas = document.createElement('canvas');
      canvas.width = 640; canvas.height = 360;
      const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
      const track = canvas.captureStream(24).getVideoTracks()[0];
      let colorGL = null;
      let color = 'none', face = 'none', tracker = null;
      let target = null, shown = null, missed = 0, busy = false;
      let lastSend = 0, gap = 66, avg = 0, slowStreak = 0, warmup = 4, stopTick = null, alive = true;

      const sendFrame = (w, h) => {
        const now = performance.now();
        if (busy || now - lastSend < gap || !window.createImageBitmap) return;
        busy = true; lastSend = now;
        const sent = now;
        createImageBitmap(video, { resizeWidth: 320, resizeHeight: Math.round(320 * video.videoHeight / video.videoWidth), resizeQuality: 'low' })
          .then(bmp => {
            if (!alive || face === 'none') { bmp.close(); busy = false; return; }
            tracker.detect(bmp, performance.now(), (m) => {
              busy = false;
              const rtt = performance.now() - sent;
              if (warmup > 0) warmup--;
              else {
                avg = avg ? avg * 0.8 + rtt * 0.2 : rtt;
                gap = avg > 120 ? 150 : avg > 70 ? 100 : 66;
                slowStreak = avg > 300 ? slowStreak + 1 : 0;
                if (slowStreak > 10) { slowStreak = 0; face = 'none'; target = shown = null; onTooSlow && onTooSlow(); return; }
              }
              if (m.pts) {
                missed = 0;
                const next = {};
                FACE_KEYS.forEach((k, i) => { next[k] = { x: m.pts[i][0], y: m.pts[i][1] }; });
                target = next;
              } else if (++missed > 4) { target = null; shown = null; }
            });
          })
          .catch(() => { busy = false; });
      };

      const frame = () => {
        if (video.readyState < 2 || !video.videoWidth) return;
        const s = Math.min(1, 640 / video.videoWidth);
        const w = Math.round(video.videoWidth * s), h = Math.round(video.videoHeight * s);
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
        const g = COLOR_GRADES[color];
        if (g && colorGL) { colorGL.draw(video, w, h, g); ctx.drawImage(colorGL.canvas, 0, 0, w, h); }
        else ctx.drawImage(video, 0, 0, w, h);
        if (face !== 'none' && tracker) {
          sendFrame(w, h);
          if (target) {
            // Glide toward the latest tracked position so motion looks smooth between updates.
            if (!shown) shown = {};
            FACE_KEYS.forEach(k => {
              const t = target[k], c = shown[k];
              shown[k] = c ? { x: c.x + (t.x - c.x) * 0.55, y: c.y + (t.y - c.y) * 0.55 } : { x: t.x, y: t.y };
            });
            const px = {};
            FACE_KEYS.forEach(k => { px[k] = { x: shown[k].x * w, y: shown[k].y * h }; });
            drawSticker(ctx, face, px);
          }
        }
      };

      return {
        track,
        start() { if (!stopTick) stopTick = makeTicker(24, frame); },
        setSource(t) {
          video.srcObject = t ? new MediaStream([t]) : null;
          if (t) video.play().catch(() => {});
          target = shown = null;
        },
        setColor(c) {
          color = c || 'none';
          if (color !== 'none' && !colorGL) colorGL = createColorGL();
        },
        async setFace(f) {
          const want = f || 'none';
          target = shown = null; avg = 0; slowStreak = 0; warmup = 4;
          if (want === 'none') { face = 'none'; return; }
          const t = getFaceTracker();
          await t.ready;
          tracker = t;
          face = want;
        },
        stop() {
          alive = false;
          if (stopTick) { stopTick(); stopTick = null; }
          track.stop();
          video.srcObject = null;
        },
      };
    }

    /* =====================================================================
       Call engine: mesh WebRTC over Firebase signaling.
       One code path for room calls and direct (1:1) calls. Uses the
       "perfect negotiation" pattern so glare and ICE restarts are safe.
       ===================================================================== */

    function useCallEngine(username, notify) {
      const [call, setCall] = useState(null);           // { id, kind, title, roomId, target }
      const [phase, setPhase] = useState('idle');       // idle | outgoing | joining | active
      const [participants, setParticipants] = useState({});
      const [remoteStreams, setRemoteStreams] = useState({});
      const [peerStates, setPeerStates] = useState({});
      const [localStream, setLocalStream] = useState(null);
      const [muted, setMuted] = useState(false);
      const [videoOff, setVideoOff] = useState(false);
      const [sharing, setSharing] = useState(false);
      const [hand, setHand] = useState(false);
      const [speaking, setSpeaking] = useState({});
      const [connectedAt, setConnectedAt] = useState(null);
      const [reactions, setReactions] = useState([]);
      const [chat, setChat] = useState([]);
      const [incoming, setIncoming] = useState(null);
      const [facing, setFacing] = useState('user');
      const [devices, setDevices] = useState({ mic: '', cam: '', speaker: '' });
      const [effects, setEffectsState] = useState(() => store.get('pr_effects') || { color: 'none', face: 'none' });
      const [effectsLoading, setEffectsLoading] = useState(false);
      const effectsRef = useRef(effects);
      const procRef = useRef(null);

      const me = useRef(username);
      useEffect(() => { me.current = username; }, [username]);
      const callRef = useRef(null);
      const peersRef = useRef({});
      const streamRef = useRef(null);
      const camTrackRef = useRef(null);
      const screenTrackRef = useRef(null);
      const listenersRef = useRef([]);
      const ringTimerRef = useRef(null);
      const hadOthersRef = useRef(false);
      const analysersRef = useRef({});
      const devicesRef = useRef(devices);
      useEffect(() => { devicesRef.current = devices; }, [devices]);
      const stateRef = useRef({});
      stateRef.current = { muted, videoOff, sharing, hand, facing };

      const base = () => db.ref(`${CALL_ROOT}/${callRef.current.id}`);
      const listen = (ref, ev, fn) => { ref.on(ev, fn); listenersRef.current.push(() => ref.off(ev, fn)); };
      const updateMe = (fields) => { if (callRef.current) base().child(`participants/${me.current}`).update(fields).catch(() => {}); };

      /* ---------- speaking detection ---------- */
      const watchLevel = (key, stream) => {
        const ctx = Sfx.ctx();
        const prev = analysersRef.current[key];
        if (prev) { if (prev.stream === stream) return; try { prev.src.disconnect(); } catch (e) {} }
        if (!ctx || !stream || !stream.getAudioTracks().length) { delete analysersRef.current[key]; return; }
        try {
          const src = ctx.createMediaStreamSource(stream);
          const an = ctx.createAnalyser();
          an.fftSize = 512;
          src.connect(an);
          analysersRef.current[key] = { src, an, stream, buf: new Uint8Array(an.fftSize), hold: 0 };
        } catch (e) { delete analysersRef.current[key]; }
      };
      useEffect(() => {
        if (!call) return;
        const iv = setInterval(() => {
          const next = {};
          Object.entries(analysersRef.current).forEach(([key, a]) => {
            a.an.getByteTimeDomainData(a.buf);
            let sum = 0;
            for (let i = 0; i < a.buf.length; i++) { const v = (a.buf[i] - 128) / 128; sum += v * v; }
            const rms = Math.sqrt(sum / a.buf.length);
            if (rms > 0.04) a.hold = 4; else if (a.hold > 0) a.hold--;
            if (a.hold > 0) next[key] = true;
          });
          setSpeaking(prev => {
            const a = Object.keys(prev).sort().join(), b = Object.keys(next).sort().join();
            return a === b ? prev : next;
          });
        }, 150);
        return () => clearInterval(iv);
      }, [call]);

      /* ---------- media ---------- */
      const audioConstraints = () => ({
        echoCancellation: true, noiseSuppression: true, autoGainControl: true,
        ...(devicesRef.current.mic ? { deviceId: { exact: devicesRef.current.mic } } : {}),
      });
      const videoConstraints = (facingMode) => ({
        width: { ideal: 960 }, height: { ideal: 540 }, frameRate: { ideal: 30, max: 30 },
        ...(devicesRef.current.cam && !facingMode ? { deviceId: { exact: devicesRef.current.cam } } : { facingMode: facingMode || stateRef.current.facing }),
      });

      const getInitialMedia = async (wantVideo) => {
        const md = navigator.mediaDevices;
        if (!md || !md.getUserMedia) throw new Error('This browser does not support calls (needs HTTPS)');
        try { return await md.getUserMedia({ audio: audioConstraints(), video: wantVideo ? videoConstraints() : false }); }
        catch (e) {
          if (wantVideo) {
            try { const s = await md.getUserMedia({ audio: audioConstraints() }); notify('Camera unavailable, joined with audio only', 'info'); return s; } catch (e2) {}
            try { const s = await md.getUserMedia({ video: videoConstraints() }); notify('Microphone unavailable, joined with video only', 'info'); return s; } catch (e3) {}
          }
          notify('No camera or mic access. You can still watch and listen.', 'error');
          return new MediaStream();
        }
      };

      const camOut = () => (camTrackRef.current && procRef.current) ? procRef.current.track : camTrackRef.current;

      const publishLocal = () => {
        const tracks = [];
        const a = streamRef.current && streamRef.current.getAudioTracks()[0];
        if (a) tracks.push(a);
        const v = camOut();
        if (v) tracks.push(v);
        streamRef.current = new MediaStream(tracks);
        setLocalStream(streamRef.current);
        watchLevel(me.current, streamRef.current);
      };

      const outgoingVideoTrack = () => screenTrackRef.current || camOut() || null;

      const forEachPeer = (fn) => Object.values(peersRef.current).forEach(fn);
      const setVideoSenders = (track) => forEachPeer(st => { if (st.videoTx) st.videoTx.sender.replaceTrack(track).catch(() => {}); });
      const setAudioSenders = (track) => forEachPeer(st => { if (st.audioTx) st.audioTx.sender.replaceTrack(track).catch(() => {}); });

      const applyEffects = async (next) => {
        effectsRef.current = next;
        setEffectsState(next);
        store.set('pr_effects', next);
        if (!effectsActive(next)) {
          if (procRef.current) { const old = procRef.current; procRef.current = null; if (!screenTrackRef.current) setVideoSenders(camOut()); publishLocal(); old.stop(); }
          return;
        }
        if (!procRef.current) {
          procRef.current = createEffectsProcessor({
            onTooSlow: () => {
              notify('Face effects were too slow on this device, so they were turned off', 'error');
              applyEffects({ ...effectsRef.current, face: 'none' });
            },
          });
          procRef.current.start();
          procRef.current.setSource(camTrackRef.current);
          if (!screenTrackRef.current) setVideoSenders(camOut());
          publishLocal();
        }
        const proc = procRef.current;
        proc.setColor(next.color);
        if (next.face !== 'none') {
          setEffectsLoading(true);
          try { await proc.setFace(next.face); }
          catch (e) {
            notify("Couldn't load face effects. Check your connection.", 'error');
            effectsRef.current = { ...effectsRef.current, face: 'none' };
            setEffectsState(effectsRef.current);
            proc.setFace('none');
          } finally { setEffectsLoading(false); }
        } else proc.setFace('none');
      };

      const setEffects = (next) => {
        if (!camTrackRef.current && effectsActive(next)) notify('Turn your camera on to see effects', 'info');
        applyEffects(next);
      };

      // Lower per-peer bitrate as the mesh grows so bigger calls stay smooth.
      const tuneBitrates = () => {
        const n = Object.keys(peersRef.current).length;
        const sharing = !!screenTrackRef.current;
        const cap = sharing ? 1_500_000 : n <= 1 ? 1_200_000 : n <= 3 ? 700_000 : n <= 5 ? 400_000 : 250_000;
        const scale = sharing || n <= 2 ? 1 : n <= 4 ? 1.5 : 2;
        forEachPeer(st => {
          const sender = st.videoTx && st.videoTx.sender;
          if (!sender || !sender.getParameters) return;
          const p = sender.getParameters();
          if (!p.encodings || !p.encodings.length) return;
          p.encodings[0].maxBitrate = cap;
          p.encodings[0].scaleResolutionDownBy = scale;
          p.encodings[0].maxFramerate = n > 4 && !sharing ? 20 : 30;
          sender.setParameters(p).catch(() => {});
        });
      };

      /* ---------- peers ---------- */
      const sendSignal = (to, payload) => {
        if (!callRef.current) return;
        base().child(`sig/${to}`).push({ from: me.current, ...clean(payload) }).catch(() => {});
      };

      const attachLocalTracks = (st) => {
        // Callee side: reuse the transceivers the caller created, so only one negotiation is needed.
        st.pc.getTransceivers().forEach(tx => {
          const kind = tx.receiver.track && tx.receiver.track.kind;
          if ((kind === 'audio' && !st.audioTx) || (kind === 'video' && !st.videoTx)) {
            // Same stream id on audio + video lets the other side keep lips in sync.
            if (tx.sender.setStreams) { try { tx.sender.setStreams(callRef.current.sync); } catch (e) {} }
          }
          if (kind === 'audio' && !st.audioTx) {
            st.audioTx = tx; tx.direction = 'sendrecv';
            tx.sender.replaceTrack((streamRef.current && streamRef.current.getAudioTracks()[0]) || null).catch(() => {});
          } else if (kind === 'video' && !st.videoTx) {
            st.videoTx = tx; tx.direction = 'sendrecv';
            tx.sender.replaceTrack(outgoingVideoTrack()).catch(() => {});
          }
        });
      };

      const closePeer = (peer) => {
        const st = peersRef.current[peer];
        if (!st) return;
        clearTimeout(st.discTimer);
        try { st.pc.close(); } catch (e) {}
        delete peersRef.current[peer];
        const a = analysersRef.current[peer];
        if (a) { try { a.src.disconnect(); } catch (e) {} delete analysersRef.current[peer]; }
        setRemoteStreams(p => { const n = { ...p }; delete n[peer]; return n; });
        setPeerStates(p => { const n = { ...p }; delete n[peer]; return n; });
        tuneBitrates();
      };
