      const createPeer = (peer, joined) => {
        const pc = new RTCPeerConnection({ iceServers: callRef.current.ice, bundlePolicy: 'max-bundle' });
        const st = { pc, joined, polite: me.current > peer, makingOffer: false, ignoreOffer: false, pendingIce: [], queue: Promise.resolve(), remote: new MediaStream(), discTimer: null };
        peersRef.current[peer] = st;
        setPeerStates(p => ({ ...p, [peer]: 'connecting' }));

        if (me.current < peer) {
          // Caller side: create both transceivers up front so camera/screen can be swapped later with replaceTrack.
          const s = streamRef.current;
          const sync = [callRef.current.sync];
          st.audioTx = pc.addTransceiver((s && s.getAudioTracks()[0]) || 'audio', { direction: 'sendrecv', streams: sync });
          st.videoTx = pc.addTransceiver(outgoingVideoTrack() || 'video', { direction: 'sendrecv', streams: sync });
        }

        pc.onnegotiationneeded = async () => {
          try {
            st.makingOffer = true;
            await pc.setLocalDescription();
            sendSignal(peer, { type: 'sdp', description: pc.localDescription.toJSON() });
          } catch (e) { console.warn('[call] negotiation', e); }
          finally { st.makingOffer = false; }
        };
        pc.onicecandidate = ({ candidate }) => { if (candidate) sendSignal(peer, { type: 'ice', candidate: candidate.toJSON() }); };
        pc.ontrack = ({ track }) => {
          const keep = st.remote.getTracks().filter(t => t.kind !== track.kind);
          st.remote = new MediaStream([...keep, track]);
          setRemoteStreams(p => ({ ...p, [peer]: st.remote }));
          if (track.kind === 'audio') watchLevel(peer, st.remote);
          track.onunmute = () => { st.remote = new MediaStream(st.remote.getTracks()); setRemoteStreams(p => ({ ...p, [peer]: st.remote })); };
        };
        pc.onconnectionstatechange = () => {
          const s = pc.connectionState;
          setPeerStates(p => ({ ...p, [peer]: s }));
          clearTimeout(st.discTimer);
          if (s === 'connected') tuneBitrates();
          if (s === 'failed') { if (!st.polite) pc.restartIce(); }
          if (s === 'disconnected') st.discTimer = setTimeout(() => { if (pc.connectionState === 'disconnected' && !st.polite) pc.restartIce(); }, 4000);
        };
        return st;
      };

      const handleSignal = (from, msg) => {
        let st = peersRef.current[from];
        if (!st) st = createPeer(from);
        const pc = st.pc;
        st.queue = st.queue.then(async () => {
          if (pc.signalingState === 'closed') return;
          if (msg.type === 'sdp') {
            const desc = msg.description;
            const collision = desc.type === 'offer' && (st.makingOffer || pc.signalingState !== 'stable');
            st.ignoreOffer = !st.polite && collision;
            if (st.ignoreOffer) return;
            await pc.setRemoteDescription(desc);
            if (desc.type === 'offer') {
              attachLocalTracks(st);
              await pc.setLocalDescription();
              sendSignal(from, { type: 'sdp', description: pc.localDescription.toJSON() });
            }
            for (const c of st.pendingIce.splice(0)) { try { await pc.addIceCandidate(c); } catch (e) {} }
          } else if (msg.type === 'ice') {
            if (!pc.remoteDescription) { st.pendingIce.push(msg.candidate); return; }
            try { await pc.addIceCandidate(msg.candidate); } catch (e) { if (!st.ignoreOffer) console.warn('[call] ice', e); }
          }
        }).catch(e => console.warn('[call] signal', e));
      };

      /* ---------- join / leave ---------- */
      const resetState = () => {
        setCall(null); setPhase('idle'); setParticipants({}); setRemoteStreams({}); setPeerStates({});
        setLocalStream(null); setMuted(false); setVideoOff(false); setSharing(false); setHand(false);
        setSpeaking({}); setConnectedAt(null); setReactions([]); setChat([]);
      };

      const leave = async (opts = {}) => {
        const c = callRef.current;
        if (!c) return;
        const callBase = base();
        callRef.current = null;
        Sfx.stopRing();
        clearTimeout(ringTimerRef.current);
        listenersRef.current.forEach(off => off());
        listenersRef.current = [];
        Object.keys(peersRef.current).forEach(closePeer);
        Object.values(analysersRef.current).forEach(a => { try { a.src.disconnect(); } catch (e) {} });
        analysersRef.current = {};
        [streamRef.current, screenTrackRef.current && new MediaStream([screenTrackRef.current])].forEach(s => s && s.getTracks().forEach(t => t.stop()));
        if (camTrackRef.current) camTrackRef.current.stop();
        streamRef.current = null; camTrackRef.current = null; screenTrackRef.current = null;
        if (procRef.current) { procRef.current.stop(); procRef.current = null; }
        hadOthersRef.current = false;
        const myRef = callBase.child(`participants/${me.current}`);
        myRef.onDisconnect().cancel();
        callBase.child(`sig/${me.current}`).onDisconnect().cancel();
        await Promise.all([myRef.remove(), callBase.child(`sig/${me.current}`).remove()]).catch(() => {});
        if (c.target) db.ref(`rings/${c.target}/${me.current}`).remove().catch(() => {});
        // Last one out cleans up the whole call node.
        callBase.child('participants').once('value').then(s => { if (!s.exists()) callBase.remove(); }).catch(() => {});
        resetState();
        if (!opts.silent) Sfx.leave();
        if (opts.message) notify(opts.message, 'info');
        addDebugLogGlobal('Left call', 'info');
      };

      const join = async (callId, meta, opts = {}) => {
        if (!db || !me.current) return;
        if (callRef.current) {
          if (callRef.current.id === callId) return;
          await leave({ silent: true });
        }
        const info = { id: callId, ...meta, sync: new MediaStream() };
        callRef.current = info;
        hadOthersRef.current = false;
        setCall(info);
        setPhase(meta.target ? 'outgoing' : 'joining');

        const ice = fetchIceServers();
        const stream = await getInitialMedia(opts.video !== false);
        if (callRef.current !== info) { stream.getTracks().forEach(t => t.stop()); return; }
        info.ice = await ice;

        camTrackRef.current = stream.getVideoTracks()[0] || null;
        streamRef.current = stream;
        if (camTrackRef.current && effectsActive(effectsRef.current)) applyEffects(effectsRef.current);
        publishLocal();
        const hasAudio = stream.getAudioTracks().length > 0;
        setMuted(!hasAudio);
        setVideoOff(!camTrackRef.current);

        const b = base();
        const myInbox = b.child(`sig/${me.current}`);
        await myInbox.remove().catch(() => {});
        const myRef = b.child(`participants/${me.current}`);
        myRef.onDisconnect().remove();
        myInbox.onDisconnect().remove();
        await myRef.set({ joined: firebase.database.ServerValue.TIMESTAMP, muted: !hasAudio, videoOff: !camTrackRef.current, screen: false, hand: false });
        if (callRef.current !== info) return;

        listen(b.child('participants'), 'value', snap => {
          if (callRef.current !== info) return;
          const all = snap.val() || {};
          if (!all[me.current]) {
            // We got removed (e.g. a network blip fired onDisconnect). Put ourselves back.
            myRef.set({ joined: firebase.database.ServerValue.TIMESTAMP, muted: stateRef.current.muted, videoOff: stateRef.current.videoOff, screen: stateRef.current.sharing, hand: stateRef.current.hand });
            return;
          }
          setParticipants(all);
          const others = Object.keys(all).filter(u => u !== me.current);
          others.forEach(u => {
            const st = peersRef.current[u];
            if (st && st.joined && all[u].joined && st.joined !== all[u].joined) closePeer(u); // they rejoined
            if (!peersRef.current[u]) createPeer(u, all[u].joined);
            else if (!peersRef.current[u].joined) peersRef.current[u].joined = all[u].joined;
          });
          Object.keys(peersRef.current).forEach(u => { if (!all[u]) closePeer(u); });
          tuneBitrates();

          if (others.length && !hadOthersRef.current) {
            hadOthersRef.current = true;
            Sfx.stopRing();
            clearTimeout(ringTimerRef.current);
            if (info.target) db.ref(`rings/${info.target}/${me.current}`).remove().catch(() => {});
            setPhase('active');
            setConnectedAt(Date.now());
            Sfx.join();
          } else if (!others.length && hadOthersRef.current && info.kind === 'dm') {
            leave({ message: 'Call ended' });
          }
        });

        listen(myInbox, 'child_added', snap => {
          const m = snap.val();
          snap.ref.remove().catch(() => {});
          if (m && m.from && callRef.current === info) handleSignal(m.from, m);
        });

        listen(b.child('reactions').limitToLast(10), 'child_added', snap => {
          const r = snap.val();
          if (!r || (r.ts && Date.now() - r.ts > 5000)) return;
          const id = snap.key;
          const x = 10 + Math.random() * 80;
          setReactions(p => [...p.slice(-20), { id, x, ...r }]);
          setTimeout(() => setReactions(p => p.filter(q => q.id !== id)), 3200);
          if (r.from === me.current) setTimeout(() => snap.ref.remove().catch(() => {}), 5000);
        });

        listen(b.child('chat').limitToLast(100), 'value', snap => {
          const d = snap.val() || {};
          setChat(Object.entries(d).map(([id, v]) => ({ id, ...v })).sort((a, z) => a.ts - z.ts));
        });

        if (info.target) {
          // Direct call: ring the other person and give up if nobody answers.
          const ringRef = db.ref(`rings/${info.target}/${me.current}`);
          ringRef.onDisconnect().remove();
          await ringRef.set({ from: me.current, callId, roomId: info.roomId || null, ts: firebase.database.ServerValue.TIMESTAMP });
          Sfx.ringOut();
          listen(ringRef.child('status'), 'value', s => {
            if (s.val() === 'declined' && callRef.current === info) {
              ringRef.remove().catch(() => {});
              leave({ message: `${info.target} declined the call` });
            } else if (s.val() === 'busy' && callRef.current === info) {
              ringRef.remove().catch(() => {});
              leave({ message: `${info.target} is busy` });
            }
          });
          ringTimerRef.current = setTimeout(() => {
            if (callRef.current === info && !hadOthersRef.current) leave({ message: `${info.target} didn't answer` });
          }, RING_TIMEOUT_MS);
        } else {
          setPhase(p => p === 'joining' ? 'waiting' : p);
        }
        addDebugLogGlobal(`Joined call ${callId}`, 'success');
      };

      /* ---------- public actions ---------- */
      const joinRoomCall = (roomId, roomName) => join(`room_${roomId}`, { kind: 'room', roomId, title: roomName || 'Room call' });

      const callUser = (target, roomId) => {
        if (!target || target === me.current) return;
        const [a, b] = [me.current, target].sort();
        const id = `dm_${a}__${b}_${Date.now()}`.replace(/[.#$\[\]]/g, '_');
        join(id, { kind: 'dm', title: target, target, roomId: roomId || null });
      };

      const acceptIncoming = async (withVideo = true) => {
        const r = incoming;
        if (!r) return;
        Sfx.stopRing();
        setIncoming(null);
        db.ref(`rings/${me.current}/${r.from}`).remove().catch(() => {});
        await join(r.callId, { kind: 'dm', title: r.from, roomId: r.roomId || null }, { video: withVideo });
      };

      const declineIncoming = () => {
        const r = incoming;
        if (!r) return;
        Sfx.stopRing();
        setIncoming(null);
        db.ref(`rings/${me.current}/${r.from}/status`).set('declined').catch(() => {});
      };

      const toggleMute = () => {
        const t = streamRef.current && streamRef.current.getAudioTracks()[0];
        if (!t) { notify('No microphone available', 'error'); return; }
        t.enabled = !t.enabled;
        setMuted(!t.enabled);
        updateMe({ muted: !t.enabled });
      };

      const startCamera = async (facingMode) => {
        try {
          const s = await navigator.mediaDevices.getUserMedia({ video: videoConstraints(facingMode) });
          const t = s.getVideoTracks()[0];
          if (camTrackRef.current) camTrackRef.current.stop();
          camTrackRef.current = t;
          if (procRef.current) procRef.current.setSource(t);
          if (!screenTrackRef.current) setVideoSenders(camOut());
          publishLocal();
          setVideoOff(false);
          updateMe({ videoOff: false });
          return true;
        } catch (e) {
          notify('Could not start camera: ' + (e.message || e.name), 'error');
          return false;
        }
      };

      const toggleVideo = async () => {
        if (camTrackRef.current) {
          // Fully stop the camera so the hardware light turns off.
          camTrackRef.current.stop();
          camTrackRef.current = null;
          if (procRef.current) procRef.current.setSource(null);
          if (!screenTrackRef.current) setVideoSenders(null);
          publishLocal();
          setVideoOff(true);
          updateMe({ videoOff: true });
        } else {
          await startCamera();
        }
      };

      const flipCamera = async () => {
        const next = stateRef.current.facing === 'user' ? 'environment' : 'user';
        setFacing(next);
        stateRef.current.facing = next;
        setDevices(d => ({ ...d, cam: '' }));
        devicesRef.current = { ...devicesRef.current, cam: '' };
        await startCamera(next);
      };

      const stopShare = () => {
        const t = screenTrackRef.current;
        if (!t) return;
        t.onended = null;
        t.stop();
        screenTrackRef.current = null;
        setVideoSenders(camOut());
        setSharing(false);
        updateMe({ screen: false });
        tuneBitrates();
      };

      const toggleShare = async () => {
        if (screenTrackRef.current) { stopShare(); return; }
        if (!navigator.mediaDevices.getDisplayMedia) { notify('Screen sharing is not supported on this device', 'error'); return; }
        try {
          const ds = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 15, max: 30 } }, audio: false });
          const t = ds.getVideoTracks()[0];
          if ('contentHint' in t) t.contentHint = 'detail';
          t.onended = stopShare;
          screenTrackRef.current = t;
          setVideoSenders(t);
          setSharing(true);
          updateMe({ screen: true });
          tuneBitrates();
        } catch (e) { if (e.name !== 'NotAllowedError') notify('Screen share failed: ' + e.message, 'error'); }
      };

      const toggleHand = () => { const v = !stateRef.current.hand; setHand(v); updateMe({ hand: v }); };

      const sendReaction = (emoji) => {
        if (callRef.current) base().child('reactions').push({ from: me.current, emoji, ts: firebase.database.ServerValue.TIMESTAMP });
      };

      const sendChat = (text) => {
        const t = (text || '').trim();
        if (t && callRef.current) base().child('chat').push({ from: me.current, text: t.slice(0, 1000), ts: firebase.database.ServerValue.TIMESTAMP });
      };

      const selectDevice = async (kind, deviceId) => {
        setDevices(d => ({ ...d, [kind]: deviceId }));
        devicesRef.current = { ...devicesRef.current, [kind]: deviceId };
        if (kind === 'cam' && camTrackRef.current) await startCamera();
        if (kind === 'mic' && streamRef.current) {
          try {
            const s = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints() });
            const t = s.getAudioTracks()[0];
            t.enabled = !stateRef.current.muted;
            const old = streamRef.current.getAudioTracks()[0];
            if (old) old.stop();
            streamRef.current = new MediaStream([t, ...(camTrackRef.current ? [camTrackRef.current] : [])]);
            setAudioSenders(t);
            publishLocal();
          } catch (e) { notify('Could not switch microphone', 'error'); }
        }
      };

      /* ---------- incoming rings ---------- */
      useEffect(() => {
        if (!username || !db) return;
        const ref = db.ref(`rings/${username}`);
        const fn = snap => {
          const all = snap.val() || {};
          const now = Date.now();
          const live = Object.values(all).filter(r => r && r.from && !r.status && (!r.ts || now - r.ts < RING_TIMEOUT_MS + 5000));
          const ring = live.sort((a, b) => (b.ts || 0) - (a.ts || 0))[0] || null;
          setIncoming(prev => {
            if (ring && (!prev || prev.callId !== ring.callId)) Sfx.ringIn();
            if (!ring && prev) Sfx.stopRing();
            return ring;
          });
        };
        ref.on('value', fn);
        return () => { ref.off('value', fn); Sfx.stopRing(); };
      }, [username]);

      // Stop ringing on our side if the caller gives up.
      useEffect(() => {
        if (!incoming) return;
        const t = setTimeout(() => { setIncoming(null); Sfx.stopRing(); }, RING_TIMEOUT_MS + 3000);
        return () => clearTimeout(t);
      }, [incoming]);

      // Leave cleanly if the tab closes mid-call.
      useEffect(() => {
        const fn = () => { if (callRef.current) leave({ silent: true }); };
        window.addEventListener('pagehide', fn);
        return () => window.removeEventListener('pagehide', fn);
      }, []);

      return {
        call, phase, participants, remoteStreams, peerStates, localStream, muted, videoOff, sharing, hand,
        speaking, connectedAt, reactions, chat, incoming, devices, facing, effects, effectsLoading, setEffects,
        joinRoomCall, callUser, acceptIncoming, declineIncoming, leave,
        toggleMute, toggleVideo, toggleShare, toggleHand, flipCamera, sendReaction, sendChat, selectDevice,
      };
    }

    /* =====================================================================
       Call UI
       ===================================================================== */

    const CallTile = ({ name, stream, isMe, info = {}, speaking, state, videoOn, mirror, pinned, onPin, compact, reactionsFor }) => {
      const hasVideo = videoOn && stream && stream.getVideoTracks().some(t => t.readyState === 'live' && (isMe || !t.muted));
      const reconnecting = !isMe && state && state !== 'connected';
      return (
        <div className={`pr-tile${speaking && !info.muted ? ' speaking' : ''}${pinned ? ' pinned' : ''}${compact ? ' compact' : ''}`} onDoubleClick={onPin}>
          {hasVideo ? (
            <StreamVideo stream={stream} mirror={mirror} className="pr-tile-video" fit={info.screen ? 'contain' : 'cover'} />
          ) : (
            <div className="pr-tile-avatar">
              <div className="pr-tile-avatar-ring"><Avatar name={name} size={compact ? 44 : 84} /></div>
            </div>
          )}
          {reconnecting && (
            <div className="pr-tile-status"><div className="pr-spinner" />{state === 'connecting' || state === 'new' ? 'Connecting…' : 'Reconnecting…'}</div>
          )}
          {info.hand && <div className="pr-tile-hand">✋</div>}
          <div className="pr-tile-name">
            {info.muted && <span className="pr-tile-muted">{I.micOff}</span>}
            <span>{isMe ? `${name} (you)` : name}</span>
            {info.screen && <span className="pr-tile-chip">presenting</span>}
          </div>
          {onPin && !compact && (
            <button className="pr-tile-pin" title={pinned ? 'Unpin' : 'Pin'} onClick={onPin}>{pinned ? I.x : I.pin}</button>
          )}
          {reactionsFor && reactionsFor.map(r => <div key={r.id} className="pr-tile-reaction">{r.emoji}</div>)}
        </div>
      );
    };

    const CallChat = ({ chat, me, onSend, onClose }) => {
      const [text, setText] = useState('');
      const endRef = useRef(null);
      useEffect(() => { endRef.current && endRef.current.scrollIntoView({ behavior: 'smooth' }); }, [chat.length]);
      const send = () => { onSend(text); setText(''); };
      return (
        <div className="pr-call-chat">
          <div className="pr-call-chat-head"><span>Call chat</span><button className="pr-icon-btn" onClick={onClose}>{I.x}</button></div>
          <div className="pr-call-chat-list">
            {chat.length === 0 && <div className="pr-empty">Messages sent here are only visible to people in the call.</div>}
            {chat.map((m, i) => {
              const grouped = i > 0 && chat[i - 1].from === m.from;
              return (
                <div key={m.id} className={'pr-call-chat-msg' + (m.from === me ? ' mine' : '')}>
                  {!grouped && <div className="pr-call-chat-from" style={{ color: userColor(m.from) }}>{m.from}</div>}
                  <div className="pr-call-chat-text">{m.text}</div>
                </div>
              );
            })}
            <div ref={endRef} />
          </div>
          <div className="pr-call-chat-input">
            <input value={text} onChange={e => setText(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') send(); e.stopPropagation(); }} placeholder="Send a message…" />
            <button className="pr-icon-btn solid" onClick={send} disabled={!text.trim()}>{I.send}</button>
          </div>
        </div>
      );
    };

    const DeviceMenu = ({ engine, onClose }) => {
      const [list, setList] = useState({ mic: [], cam: [], speaker: [] });
      useEffect(() => {
        navigator.mediaDevices.enumerateDevices().then(ds => setList({
          mic: ds.filter(d => d.kind === 'audioinput'),
          cam: ds.filter(d => d.kind === 'videoinput'),
          speaker: ds.filter(d => d.kind === 'audiooutput'),
        })).catch(() => {});
      }, []);
      const canSink = typeof HTMLMediaElement !== 'undefined' && 'setSinkId' in HTMLMediaElement.prototype;
      const row = (kind, label) => list[kind].length > 0 && (
        <label className="pr-device-row">
          <span>{label}</span>
          <select value={engine.devices[kind]} onChange={e => engine.selectDevice(kind, e.target.value)}>
            <option value="">Default</option>
            {list[kind].map((d, i) => <option key={d.deviceId || i} value={d.deviceId}>{d.label || `${label} ${i + 1}`}</option>)}
          </select>
        </label>
      );
      return (
        <div className="pr-popover pr-device-menu" onClick={e => e.stopPropagation()}>
          <div className="pr-popover-title">Devices <button className="pr-icon-btn" onClick={onClose}>{I.x}</button></div>
          {row('mic', 'Microphone')}
          {row('cam', 'Camera')}
          {canSink && row('speaker', 'Speaker')}
        </div>
      );
    };

    const EffectsMenu = ({ engine, onClose }) => {
      const fx = engine.effects;
      return (
        <div className="pr-popover pr-effects-menu" onClick={e => e.stopPropagation()}>
          <div className="pr-popover-title">
            <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>Effects {engine.effectsLoading && <span className="pr-spinner" style={{ width: 14, height: 14 }} />}</span>
            <button className="pr-icon-btn" onClick={onClose}>{I.x}</button>
          </div>
          <div className="pr-fx-label">Face</div>
          <div className="pr-fx-grid">
            {FACE_EFFECTS.map(f => (
              <button key={f.id} className={'pr-fx' + (fx.face === f.id ? ' on' : '')} onClick={() => engine.setEffects({ ...fx, face: f.id })}>
                <span className="pr-fx-icon">{f.icon}</span><small>{f.label}</small>
              </button>
            ))}
          </div>
          {<>
            <div className="pr-fx-label">Color</div>
            <div className="pr-fx-grid">
              {COLOR_FILTERS.map(f => (
                <button key={f.id} className={'pr-fx' + (fx.color === f.id ? ' on' : '')} onClick={() => engine.setEffects({ ...fx, color: f.id })}>
                  <i className="pr-fx-swatch" style={{ filter: f.css }} /><small>{f.label}</small>
                </button>
              ))}
            </div>
          </>}
          {engine.effectsLoading && <div className="pr-fx-note">Loading face tracking (first time only)…</div>}
          {engine.videoOff && <div className="pr-fx-note">Turn your camera on to see effects.</div>}
        </div>
      );
    };

    function CallOverlay({ engine, me, minimized, setMinimized }) {
      const { call, phase, participants, remoteStreams, peerStates, localStream, speaking, connectedAt } = engine;
      const [pinned, setPinned] = useState(null);
      const [showChat, setShowChat] = useState(false);
      const [menu, setMenu] = useState(null); // 'react' | 'devices'
      const [now, setNow] = useState(Date.now());
      const [idle, setIdle] = useState(false);
      const [seenChat, setSeenChat] = useState(0);
      const idleTimer = useRef(null);

      useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
      useEffect(() => { if (showChat) setSeenChat(engine.chat.length); }, [showChat, engine.chat.length]);
      useEffect(() => {
        const last = engine.chat[engine.chat.length - 1];
        if (last && last.from !== me && !showChat) Sfx.blip();
      }, [engine.chat.length]);

      const wake = () => {
        setIdle(false);
        clearTimeout(idleTimer.current);
        idleTimer.current = setTimeout(() => setIdle(true), 3500);
      };
      useEffect(() => { wake(); return () => clearTimeout(idleTimer.current); }, []);

      useEffect(() => {
        const onKey = (e) => {
          if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          const k = e.key.toLowerCase();
          if (k === 'm') engine.toggleMute();
          else if (k === 'v') engine.toggleVideo();
          else if (k === 'h') engine.toggleHand();
          else if (k === 'c') setShowChat(s => !s);
          else if (k === 'escape') setMenu(null);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [engine]);

      if (!call) return null;

      const others = Object.keys(participants).filter(u => u !== me).sort((a, b) => (participants[a].joined || 0) - (participants[b].joined || 0));
      const myInfo = { muted: engine.muted, hand: engine.hand, screen: engine.sharing };
      const presenter = others.find(u => participants[u] && participants[u].screen);
      const focus = pinned && (pinned === me || others.includes(pinned)) ? pinned : presenter || null;
      const unread = Math.max(0, engine.chat.length - seenChat);
      const reactionsFor = (u) => engine.reactions.filter(r => r.from === u);

      const tile = (u, extra = {}) => u === me ? (
        <CallTile key={u} name={me} isMe stream={localStream} info={myInfo} speaking={speaking[me]}
          videoOn={!engine.videoOff || engine.sharing} mirror={!engine.sharing && engine.facing === 'user'}
          pinned={focus === me} onPin={() => setPinned(p => p === me ? null : me)} reactionsFor={reactionsFor(me)} {...extra} />
      ) : (
        <CallTile key={u} name={u} stream={remoteStreams[u]} info={participants[u] || {}} speaking={speaking[u]} state={peerStates[u]}
          videoOn={!(participants[u] || {}).videoOff || (participants[u] || {}).screen}
          pinned={focus === u} onPin={() => setPinned(p => p === u ? null : u)} reactionsFor={reactionsFor(u)} {...extra} />
      );

      const audio = others.map(u => <StreamAudio key={u} stream={remoteStreams[u]} sinkId={engine.devices.speaker} />);
      const timer = connectedAt ? fmtDuration(now - connectedAt) : null;
      const waiting = phase !== 'active' && others.length === 0;
      const title = call.kind === 'dm' ? call.title : call.title;

      /* ----- minimized: floating mini player ----- */
      if (minimized) {
        const star = others.find(u => speaking[u]) || others[0];
        return (
          <>
            {audio}
            <div className="pr-mini" onClick={() => setMinimized(false)}>
              <div className="pr-mini-stage">
                {star ? tile(star, { compact: true, onPin: null }) : tile(me, { compact: true, onPin: null })}
              </div>
              <div className="pr-mini-bar" onClick={e => e.stopPropagation()}>
                <div className="pr-mini-info">
                  <span className="pr-live-dot" />
                  <span className="pr-mini-title">{waiting ? (phase === 'outgoing' ? `Calling ${call.target}…` : 'Waiting…') : title}</span>
                  {timer && <span className="pr-mini-timer">{timer}</span>}
                </div>
                <button className={'pr-mini-btn' + (engine.muted ? ' off' : '')} onClick={engine.toggleMute} title="Mute (M)">{engine.muted ? I.micOff : I.mic}</button>
                <button className="pr-mini-btn" onClick={() => setMinimized(false)} title="Expand">{I.expand}</button>
                <button className="pr-mini-btn end" onClick={() => engine.leave()} title="Leave">{I.hangup}</button>
              </div>
            </div>
          </>
        );
      }

      /* ----- full screen ----- */
      const count = others.length + 1;
      let stage;
      if (phase === 'outgoing' && waiting) {
        stage = (
          <div className="pr-calling">
            {localStream && !engine.videoOff && <StreamVideo stream={localStream} mirror className="pr-calling-bg" />}
            <div className="pr-calling-card">
              <div className="pr-ripple"><Avatar name={call.target} size={112} /></div>
              <h2>{call.target}</h2>
              <p>Ringing<span className="pr-dots"><i>.</i><i>.</i><i>.</i></span></p>
            </div>
          </div>
        );
      } else if (focus) {
        stage = (
          <div className="pr-stage spotlight">
            <div className="pr-stage-main">{tile(focus)}</div>
            <div className="pr-filmstrip">{[me, ...others].filter(u => u !== focus).map(u => tile(u, { compact: true }))}</div>
          </div>
        );
      } else if (others.length === 1) {
        stage = (
          <div className="pr-stage duo">
            <div className="pr-stage-main">{tile(others[0])}</div>
            <div className="pr-self-pip">{tile(me, { compact: true })}</div>
          </div>
        );
      } else {
        const cols = count <= 1 ? 1 : count <= 4 ? 2 : count <= 9 ? 3 : 4;
        stage = (
          <div className={'pr-stage grid' + (waiting ? ' waiting' : '')} style={{ '--cols': cols, '--rows': Math.ceil(count / cols) }}>
            {tile(me)}
            {others.map(u => tile(u))}
            {waiting && (
              <div className="pr-waiting-note">
                <div className="pr-spinner" />
                <div><b>You're the first one here</b><span>Others in the room will see a "Join" button.</span></div>
              </div>
            )}
          </div>
        );
      }

      return (
        <div className={'pr-call' + (idle && !menu ? ' idle' : '') + (showChat ? ' with-chat' : '')} onMouseMove={wake} onTouchStart={wake} onClick={() => setMenu(null)}>
          {audio}
          <div className="pr-call-main">
            <div className="pr-call-top">
              <div className="pr-call-title">
                <span className="pr-live-dot" />
                <b>{call.kind === 'dm' ? `Call with ${title}` : title}</b>
                {timer && <span className="pr-call-timer">{timer}</span>}
                <span className="pr-call-count">{count} {count === 1 ? 'person' : 'people'}</span>
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button className="pr-icon-btn glass" title="Minimize" onClick={(e) => { e.stopPropagation(); setMinimized(true); }}>{I.minimize}</button>
              </div>
            </div>

            {stage}

            <div className="pr-reaction-layer">
              {engine.reactions.map(r => (
                <div key={r.id} className="pr-float-emoji" style={{ left: r.x + '%' }}>
                  <span>{r.emoji}</span><small>{r.from}</small>
                </div>
              ))}
            </div>

            <div className="pr-controls" onClick={e => e.stopPropagation()}>
              <button className={'pr-ctl' + (engine.muted ? ' off' : '')} onClick={engine.toggleMute} title={engine.muted ? 'Unmute (M)' : 'Mute (M)'}>
                {engine.muted ? I.micOff : I.mic}<span>{engine.muted ? 'Unmute' : 'Mute'}</span>
              </button>
              <button className={'pr-ctl' + (engine.videoOff ? ' off' : '')} onClick={engine.toggleVideo} title="Camera (V)">
                {engine.videoOff ? I.camOff : I.cam}<span>{engine.videoOff ? 'Start video' : 'Stop video'}</span>
              </button>
              {navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia && (
                <button className={'pr-ctl' + (engine.sharing ? ' on' : '')} onClick={engine.toggleShare} title="Share screen">
                  {I.screen}<span>{engine.sharing ? 'Stop share' : 'Share'}</span>
                </button>
              )}
              {/Android|iPhone|iPad/i.test(navigator.userAgent) && (
                <button className="pr-ctl" onClick={engine.flipCamera} title="Flip camera">{I.flip}<span>Flip</span></button>
              )}
              <div className="pr-ctl-wrap">
                <button className={'pr-ctl' + (menu === 'effects' || effectsActive(engine.effects) ? ' on' : '')} onClick={() => setMenu(m => m === 'effects' ? null : 'effects')} title="Effects">
                  {I.sparkle}<span>Effects</span>
                </button>
                {menu === 'effects' && <EffectsMenu engine={engine} onClose={() => setMenu(null)} />}
              </div>
              <div className="pr-ctl-wrap">
                <button className={'pr-ctl' + (menu === 'react' ? ' on' : '')} onClick={() => setMenu(m => m === 'react' ? null : 'react')} title="React">
                  {I.smile}<span>React</span>
                </button>
                {menu === 'react' && (
                  <div className="pr-popover pr-react-menu">
                    {CALL_REACTIONS.map(e => <button key={e} onClick={() => engine.sendReaction(e)}>{e}</button>)}
                  </div>
                )}
              </div>
              <button className={'pr-ctl' + (engine.hand ? ' on' : '')} onClick={engine.toggleHand} title="Raise hand (H)">
                {I.hand}<span>{engine.hand ? 'Lower' : 'Raise'}</span>
              </button>
              <button className={'pr-ctl' + (showChat ? ' on' : '')} onClick={() => setShowChat(s => !s)} title="Chat (C)">
                {I.chat}<span>Chat</span>{unread > 0 && !showChat && <i className="pr-badge-dot">{unread}</i>}
              </button>
              <div className="pr-ctl-wrap">
                <button className={'pr-ctl' + (menu === 'devices' ? ' on' : '')} onClick={() => setMenu(m => m === 'devices' ? null : 'devices')} title="Devices">
                  {I.gear}<span>Devices</span>
                </button>
                {menu === 'devices' && <DeviceMenu engine={engine} onClose={() => setMenu(null)} />}
              </div>
              <button className="pr-ctl end" onClick={() => engine.leave()} title="Leave call">
                {I.hangup}<span>{phase === 'outgoing' && waiting ? 'Cancel' : 'Leave'}</span>
              </button>
            </div>
          </div>
          {showChat && <CallChat chat={engine.chat} me={me} onSend={engine.sendChat} onClose={() => setShowChat(false)} />}
        </div>
      );
    }

    const IncomingCall = ({ engine, inCall }) => {
      const r = engine.incoming;
      if (!r) return null;
      return (
        <div className="pr-incoming">
          <div className="pr-incoming-card">
            <div className="pr-ripple small"><Avatar name={r.from} size={64} /></div>
            <div className="pr-incoming-text">
              <b>{r.from}</b>
              <span>{inCall ? 'is calling. Answering ends your current call.' : 'is calling you…'}</span>
            </div>
            <div className="pr-incoming-actions">
              <button className="pr-round decline" onClick={engine.declineIncoming} title="Decline">{I.hangup}</button>
              <button className="pr-round audio" onClick={() => engine.acceptIncoming(false)} title="Answer with audio">{I.phone}</button>
              <button className="pr-round accept" onClick={() => engine.acceptIncoming(true)} title="Answer with video">{I.cam}</button>
            </div>
          </div>
        </div>
      );
    };

    const Lightbox = ({ src, onClose }) => src ? (
      <div className="pr-lightbox" onClick={onClose}>
        <img src={src} alt="" onClick={e => e.stopPropagation()} />
        <button className="pr-icon-btn glass pr-lightbox-close" onClick={onClose}>{I.x}</button>
      </div>
    ) : null;


    function ChatroomApp() {

      React.useEffect(() => {
        const fb = document.getElementById('boot-fallback');
        if (fb) fb.remove();
      }, []);
      const [username, setUsername] = useState('');
      const [tempUsername, setTempUsername] = useState('');
      const [currentView, setCurrentView] = useState('start');
      const [currentRoom, setCurrentRoom] = useState(null);
      const [rooms, setRooms] = useState([]);
      const [messages, setMessages] = useState([]);
      const [message, setMessage] = useState('');
      const [newRoomName, setNewRoomName] = useState('');
      const [newRoomPassword, setNewRoomPassword] = useState('');
      const [error, setError] = useState('');
      const [roomUsers, setRoomUsers] = useState([]);
      const [typingUsers, setTypingUsers] = useState([]);
      const [replyTo, setReplyTo] = useState(null);
      const [showEmojiPicker, setShowEmojiPicker] = useState(null);
      const [accountTab, setAccountTab] = React.useState('login');
      const [loginUser, setLoginUser] = React.useState('');
      const [loginPass, setLoginPass] = React.useState('');
      const [regUser, setRegUser] = React.useState('');
      const [regPass, setRegPass] = React.useState('');
      const [friends, setFriends] = React.useState([]);
      const [friendRequests, setFriendRequests] = React.useState([]);
      const [onlineUsers, setOnlineUsers] = React.useState({});
      const [addFriendInput, setAddFriendInput] = React.useState('');
      const [addFriendMsg, setAddFriendMsg] = React.useState('');
      const [showFriendsModal, setShowFriendsModal] = React.useState(false);
      const [showProfileModal, setShowProfileModal] = React.useState(false);
      const [showImageInput, setShowImageInput] = useState(false);
      const [imageUrl, setImageUrl] = useState('');
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showSnapCamera, setShowSnapCamera] = useState(false);
      const [snapStream, setSnapStream] = useState(null);
      const [capturedSnap, setCapturedSnap] = useState(null);
      const [isFrontCamera, setIsFrontCamera] = useState(true);
      const [isRecording, setIsRecording] = useState(false);
      const [recordedVideo, setRecordedVideo] = useState(null);
      const [mediaRecorder, setMediaRecorder] = useState(null);
      const [recordingTime, setRecordingTime] = useState(0);
      const [captureMode, setCaptureMode] = useState('photo'); 

      const [toasts, notify] = useToasts();
      const engine = useCallEngine(username, notify);
      const inCall = !!engine.call;
      const [callMinimized, setCallMinimized] = useState(false);
      const [roomCallUsers, setRoomCallUsers] = useState([]);
      const [editingId, setEditingId] = useState(null);
      const [editText, setEditText] = useState('');
      const [lightbox, setLightbox] = useState(null);
      const [atBottom, setAtBottom] = useState(true);
      const [newBelow, setNewBelow] = useState(0);
      const [dragOver, setDragOver] = useState(false);
      const [booting, setBooting] = useState(() => !!store.get('pr_session'));

      const messagesEndRef = useRef(null);
      const messagesBoxRef = useRef(null);
      const composerRef = useRef(null);
      const fileInputRef = useRef(null);
      const typingTimeoutRef = useRef(null);
      const snapVideoRef = useRef(null);
      const snapCanvasRef = useRef(null);
      const recordingIntervalRef = useRef(null);
      const lastMsgIdRef = useRef(null);
      const sendingSnapRef = useRef(false);
      const sendingFilesRef = useRef(false);
      const addDebugLog = (message, type = 'info') => {
        addDebugLogGlobal(message, type);
      };

      useEffect(() => {
        if (db) {
          const connectedRef = db.ref('.info/connected');
          let wasConnected = false, lostShown = false;
          const fn = (snap) => {
            const up = snap.val() === true;
            addDebugLog(up ? 'Firebase connected' : 'Firebase disconnected', up ? 'success' : 'error');
            if (wasConnected && !up) { notify('Connection lost. Reconnecting…', 'error'); lostShown = true; }
            if (up && lostShown) { notify('Back online', 'success'); lostShown = false; }
            wasConnected = up;
          };
          connectedRef.on('value', fn);
          return () => connectedRef.off('value', fn);
        }
      }, []);

      useEffect(() => {
        if (db) {
          const roomsRef = db.ref('rooms');
          const handleRooms = (snapshot) => {
            const data = snapshot.val();
            setRooms(data ? Object.values(data).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)) : []);
          };
          roomsRef.on('value', handleRooms);
          return () => roomsRef.off('value', handleRooms);
        }
      }, []);

      // Restore the saved login so a refresh doesn't sign you out.
      useEffect(() => {
        const sess = store.get('pr_session');
        if (!sess || !db) { setBooting(false); return; }
        db.ref('accounts/' + sess.u).once('value').then(snap => {
          const acc = snap.val();
          if (acc && acc.passHash && acc.passHash === sess.h) {
            setUsername(sess.u);
            setCurrentView('home');
            markOnline(sess.u);
          } else {
            store.del('pr_session');
          }
        }).catch(() => {}).finally(() => setBooting(false));
      }, []);

      // Room presence + typing indicator
      useEffect(() => {
        if (username && currentRoom && db) {
          addDebugLog(`Joined room ${currentRoom}`, 'success');
          const userRef = db.ref(`roomUsers/${currentRoom}/${username}`);
          userRef.set(Date.now());
          userRef.onDisconnect().remove();

          const usersRef = db.ref(`roomUsers/${currentRoom}`);
          const handleUsers = (snapshot) => {
            const data = snapshot.val();
            setRoomUsers(data ? Object.keys(data) : []);
          };
          usersRef.on('value', handleUsers);

          const typingRef = db.ref(`typing/${currentRoom}`);
          let typingData = {};
          const computeTypers = () => {
            const now = Date.now();
            const active = Object.entries(typingData)
              .filter(([user, time]) => user !== username && now - time < 4000)
              .map(([user]) => user);
            setTypingUsers(prev => prev.join() === active.join() ? prev : active);
          };
          const handleTyping = (snapshot) => { typingData = snapshot.val() || {}; computeTypers(); };
          typingRef.on('value', handleTyping);
          const typingInterval = setInterval(computeTypers, 1000);
          db.ref(`typing/${currentRoom}/${username}`).onDisconnect().remove();

          const kickedRef = db.ref(`kicked/${currentRoom}/${username}`);
          const handleKicked = (snap) => {
            if (snap.val()) {
              notify('You were removed from this room', 'error');
              setCurrentRoom(null);
              setCurrentView('lobby');
              setMessages([]);
            }
          };
          kickedRef.on('value', handleKicked);

          const callRef = db.ref(`${CALL_ROOT}/room_${currentRoom}/participants`);
          const handleCall = (snap) => setRoomCallUsers(Object.keys(snap.val() || {}));
          callRef.on('value', handleCall);

          return () => {
            usersRef.off('value', handleUsers);
            typingRef.off('value', handleTyping);
            kickedRef.off('value', handleKicked);
            callRef.off('value', handleCall);
            clearInterval(typingInterval);
            userRef.onDisconnect().cancel();
            userRef.remove();
            setTypingUsers([]);
            setRoomCallUsers([]);
          };
        }
      }, [username, currentRoom]);

      useEffect(() => {
        if (currentRoom && db) {
          lastMsgIdRef.current = null;
          setAtBottom(true);
          setNewBelow(0);
          const messagesRef = db.ref(`messages/${currentRoom}`).orderByKey().limitToLast(200);
          const handleMessages = (snapshot) => {
            const data = snapshot.val();
            setMessages(data ? Object.values(data).filter(m => m && m.id).sort((a, b) => a.timestamp - b.timestamp) : []);
          };
          messagesRef.on('value', handleMessages);
          return () => messagesRef.off('value', handleMessages);
        }
      }, [currentRoom]);

      // Only auto-scroll when you're already at the bottom (or you sent the message).
      useEffect(() => {
        const last = messages[messages.length - 1];
        if (!last) return;
        const first = lastMsgIdRef.current === null;
        const isNew = !first && last.id !== lastMsgIdRef.current;
        lastMsgIdRef.current = last.id;
        if (first || atBottom || last.username === username) {
          requestAnimationFrame(() => messagesEndRef.current?.scrollIntoView({ behavior: first ? 'auto' : 'smooth', block: 'end' }));
          setNewBelow(0);
        } else if (isNew) {
          setNewBelow(n => n + 1);
        }
        if (isNew && last.username && last.username !== username && last.type !== 'system') {
          const mentioned = typeof last.text === 'string' && new RegExp(`@${username}\\b`, 'i').test(last.text);
          if (document.hidden || mentioned) Sfx.blip();
          if (inCall && !callMinimized) {
            notify(`${last.username}: ${last.type === 'snap' ? 'sent a photo' : last.type === 'video' ? 'sent a video' : last.text}`, 'msg', { from: last.username, onClick: () => setCallMinimized(true) });
          } else if (mentioned) {
            notify(`${last.username} mentioned you`, 'msg', { from: last.username });
          }
        }
      }, [messages]);

      const onMessagesScroll = (e) => {
        const el = e.currentTarget;
        const bottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
        if (bottom !== atBottom) setAtBottom(bottom);
        if (bottom && newBelow) setNewBelow(0);
      };
      const jumpToBottom = () => { messagesEndRef.current?.scrollIntoView({ behavior: 'smooth', block: 'end' }); setNewBelow(0); };

      // Expand the call again when it starts; warn before closing the tab mid-call.
      useEffect(() => { if (!inCall) setCallMinimized(false); }, [inCall]);
      useEffect(() => { document.body.classList.toggle('pr-in-call', inCall && !callMinimized); }, [inCall, callMinimized]);
      useEffect(() => {
        const handleBeforeUnload = (e) => {
          if (inCall) { e.preventDefault(); e.returnValue = ''; return ''; }
        };
        window.addEventListener('beforeunload', handleBeforeUnload);
        return () => window.removeEventListener('beforeunload', handleBeforeUnload);
      }, [inCall]);

      const markOnline = (u) => {
        db.ref('presence/' + u).set({ online: true, lastSeen: Date.now() });
        db.ref('presence/' + u).onDisconnect().set({ online: false, lastSeen: firebase.database.ServerValue.TIMESTAMP });
      };

      const signOut = () => {
        if (inCall) engine.leave({ silent: true });
        if (username) {
          db.ref('presence/' + username).onDisconnect().cancel();
          db.ref('presence/' + username).set({ online: false, lastSeen: Date.now() });
        }
        store.del('pr_session');
        setCurrentRoom(null);
        setMessages([]);
        setUsername('');
        setShowProfileModal(false);
        setCurrentView('start');
      };

      const pushMessage = async (fields) => {
        if (!currentRoom || !username) return false;
        const msgId = newId();
        try {
          await db.ref(`messages/${currentRoom}/${msgId}`).set({ id: msgId, username, timestamp: Date.now(), reactions: {}, ...fields });
          return true;
        } catch (err) {
          notify('Failed to send: ' + err.message, 'error');
          addDebugLog(`Send error: ${err.message}`, 'error');
          return false;
        }
      };

      const sendImageUrl = async () => {
        let url = imageUrl.trim();
        if (!url) return;
        if (!/^https?:\/\//i.test(url) && !url.startsWith('data:image/')) { notify('That doesn\'t look like an image link', 'error'); return; }
        const giphy = url.match(/giphy\.com\/gifs\/(?:[^\/]+-)?([A-Za-z0-9]+)\/?$/);
        if (giphy) url = `https://media.giphy.com/media/${giphy[1]}/giphy.gif`;
        if (url.includes('tenor.com/view/')) { notify('For Tenor, right-click the GIF and choose "Copy image address"', 'error'); return; }
        setImageUrl(''); setShowImageInput(false);
        if (!(await pushMessage({ type: 'snap', image: url }))) setImageUrl(url);
      };

      const sendImageFiles = async (files) => {
        const list = Array.from(files || []).filter(f => f.type.startsWith('image/')).slice(0, 5);
        if (!list.length || sendingFilesRef.current) return;
        sendingFilesRef.current = true;
        try {
          for (const f of list) {
            try {
              const data = await fileToDataUrl(f, 1080, 0.75);
              if (data.length > 2.5e6) { notify(`${f.name} is too big even after compressing`, 'error'); continue; }
              await pushMessage({ type: 'snap', image: data });
            } catch (e) { notify(e.message, 'error'); }
          }
        } finally { sendingFilesRef.current = false; }
      };

      const openSnapCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: isFrontCamera ? 'user' : 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: true
          });
          setSnapStream(stream);
          setShowSnapCamera(true);
          setCaptureMode('photo');
          setTimeout(() => { if (snapVideoRef.current) snapVideoRef.current.srcObject = stream; }, 0);
        } catch (err) {
          notify('Could not access camera', 'error');
        }
      };

      const closeSnapCamera = () => {
        if (snapStream) snapStream.getTracks().forEach(track => track.stop());
        setSnapStream(null);
        if (snapVideoRef.current) snapVideoRef.current.srcObject = null;
        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        if (recordingIntervalRef.current) clearInterval(recordingIntervalRef.current);
        setShowSnapCamera(false);
        setCapturedSnap(null);
        setRecordedVideo(null);
        setIsRecording(false);
        setRecordingTime(0);
        setMediaRecorder(null);
      };

      const captureSnap = () => {
        if (snapVideoRef.current && snapCanvasRef.current) {
          const video = snapVideoRef.current;
          const canvas = snapCanvasRef.current;
          const scale = Math.min(1, 1080 / Math.max(video.videoWidth, video.videoHeight));
          canvas.width = video.videoWidth * scale;
          canvas.height = video.videoHeight * scale;
          const ctx = canvas.getContext('2d');
          if (isFrontCamera) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          setCapturedSnap(canvas.toDataURL('image/jpeg', 0.75));
        }
      };

      const startRecording = () => {
        if (!snapStream || typeof MediaRecorder === 'undefined') { notify('Video recording is not supported here', 'error'); return; }
        const type = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4']
          .find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
        const recorder = new MediaRecorder(snapStream, { ...(type ? { mimeType: type } : {}), videoBitsPerSecond: 900_000 });
        const chunks = [];
        recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
          const reader = new FileReader();
          reader.onloadend = () => setRecordedVideo(reader.result);
          reader.readAsDataURL(blob);
          clearInterval(recordingIntervalRef.current);
        };
        recorder.start(250);
        setMediaRecorder(recorder);
        setIsRecording(true);
        setRecordingTime(0);
        recordingIntervalRef.current = setInterval(() => {
          setRecordingTime(prev => {
            if (prev + 1 >= 30 && recorder.state === 'recording') { recorder.stop(); setIsRecording(false); }
            return prev + 1;
          });
        }, 1000);
      };

      const stopRecording = () => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
          setIsRecording(false);
        }
      };

      const retakeSnap = () => {
        setCapturedSnap(null);
        setRecordedVideo(null);
      };

      const flipCamera = async () => {
        const newFacingMode = !isFrontCamera;
        setIsFrontCamera(newFacingMode);
        if (snapStream) snapStream.getTracks().forEach(track => track.stop());
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: newFacingMode ? 'user' : 'environment' },
            audio: true
          });
          setSnapStream(stream);
          if (snapVideoRef.current) snapVideoRef.current.srcObject = stream;
        } catch (err) {
          notify('Could not flip camera', 'error');
        }
      };

      // Close the camera right away and upload in the background; extra taps are ignored.
      const sendSnap = async () => {
        if (sendingSnapRef.current || (!capturedSnap && !recordedVideo)) return;
        if (recordedVideo && recordedVideo.length > 9e6) { notify('That video is too long to send. Try a shorter one.', 'error'); return; }
        sendingSnapRef.current = true;
        const payload = capturedSnap ? { type: 'snap', image: capturedSnap } : { type: 'video', videoUrl: recordedVideo };
        closeSnapCamera();
        const slow = setTimeout(() => notify(payload.type === 'snap' ? 'Sending photo…' : 'Sending video…', 'info'), 600);
        try { await pushMessage(payload); } finally { clearTimeout(slow); sendingSnapRef.current = false; }
      };

      const toggleCaptureMode = () => {
        setCaptureMode(prev => prev === 'photo' ? 'video' : 'photo');
      };

      const updateTyping = () => {
        if (!currentRoom || !username || !db) return;
        const now = Date.now();
        if (!typingTimeoutRef.current || now - (typingTimeoutRef.lastSent || 0) > 1500) {
          db.ref(`typing/${currentRoom}/${username}`).set(now);
          typingTimeoutRef.lastSent = now;
        }
        clearTimeout(typingTimeoutRef.current);
        typingTimeoutRef.current = setTimeout(() => {
          db.ref(`typing/${currentRoom}/${username}`).remove();
          typingTimeoutRef.current = null;
        }, 3000);
      };

      const stopTyping = () => {
        clearTimeout(typingTimeoutRef.current);
        typingTimeoutRef.current = null;
        if (currentRoom && username) db.ref(`typing/${currentRoom}/${username}`).remove();
      };

      const createRoom = async () => {
        const name = newRoomName.trim();
        if (!name) { setError('Room name required'); return; }
        if (name.length > 40) { setError('Keep the room name under 40 characters'); return; }
        const roomId = Date.now().toString();
        const room = {
          id: roomId,
          name,
          createdAt: Date.now(),
          owner: username,
          ...(newRoomPassword ? { locked: true, passHash: await hashRoomPassword(roomId, newRoomPassword) } : {})
        };
        try {
          await db.ref(`rooms/${roomId}`).set(room);
          addDebugLog(`Room created: ${name}`, 'success');
          setCurrentRoom(roomId);
          setNewRoomName('');
          setNewRoomPassword('');
          setError('');
          setCurrentView('room');
        } catch (err) {
          setError('Failed to create room');
          addDebugLog(`Room creation error: ${err.message}`, 'error');
        }
      };

      const joinRoom = async (room, password = '') => {
        const kicked = await db.ref(`kicked/${room.id}/${username}`).once('value').catch(() => null);
        if (kicked && kicked.val()) { notify('You were removed from this room', 'error'); return; }
        if (room.passHash) {
          if ((await hashRoomPassword(room.id, password)) !== room.passHash) { notify('Incorrect password', 'error'); return; }
        } else if (room.password && room.password !== password) {
          notify('Incorrect password', 'error');
          return;
        }
        setMessages([]);
        setCurrentRoom(room.id);
        setCurrentView('room');
        setError('');
        setReplyTo(null);
        addDebugLog(`Joining room: ${room.name}`, 'info');
      };

      const sendMessage = async () => {
        const text = message.trim();
        if (!text || !currentRoom || !username) return;
        if (text.length > 4000) { notify('Message is too long', 'error'); return; }
        const reply = replyTo;
        setMessage('');
        setReplyTo(null);
        stopTyping();
        if (composerRef.current) composerRef.current.style.height = '';
        const ok = await pushMessage({ text, ...(reply && { replyTo: reply.id }) });
        if (!ok) setMessage(text);
      };

      const startEdit = (msg) => { setEditingId(msg.id); setEditText(msg.text || ''); };
      const saveEdit = async () => {
        const text = editText.trim();
        if (!editingId) return;
        if (text) await db.ref(`messages/${currentRoom}/${editingId}`).update({ text, edited: true }).catch(() => notify('Could not edit', 'error'));
        setEditingId(null);
        setEditText('');
      };
      const deleteMessage = async (msg) => {
        if (!confirm('Delete this message?')) return;
        await db.ref(`messages/${currentRoom}/${msg.id}`).remove().catch(() => notify('Could not delete', 'error'));
      };

      const addReaction = async (messageId, emoji) => {
        if (!currentRoom || !db) return;
        try {
          await db.ref(`messages/${currentRoom}/${messageId}/reactions/${emoji}`).transaction(users => {
            const list = Array.isArray(users) ? users : users ? Object.values(users) : [];
            if (list.includes(username)) {
              const next = list.filter(u => u !== username);
              return next.length ? next : null;
            }
            return [...list, username];
          });
        } catch (err) {
          addDebugLog(`Reaction error: ${err.message}`, 'error');
        }
      };

      const clearAllMessages = async () => {
        const currentRoomData = rooms.find(r => r.id === currentRoom);
        if (!currentRoomData || currentRoomData.owner !== username) {
          notify('Only the room owner can clear messages', 'error');
          return;
        }
        if (!confirm('Clear all messages in this room?')) return;
        try {
          await db.ref(`messages/${currentRoom}`).remove();
          notify('Chat cleared', 'success');
        } catch (err) {
          notify('Failed to clear messages', 'error');
        }
      };

      const kickUser = async (targetUser) => {
        const currentRoomData = rooms.find(r => r.id === currentRoom);
        if (!currentRoomData || (currentRoomData.owner !== username && username !== 'emmaowner')) {
          notify('Only the room owner can remove people', 'error');
          return;
        }
        if (!confirm(`Remove ${targetUser} from this room? They won't be able to rejoin.`)) return;
        try {
          await db.ref(`kicked/${currentRoom}/${targetUser}`).set(true);
          await db.ref(`roomUsers/${currentRoom}/${targetUser}`).remove();
          const msgId = newId();
          await db.ref(`messages/${currentRoom}/${msgId}`).set({ id: msgId, type: 'system', text: `${targetUser} was removed from the room`, timestamp: Date.now() });
          notify(`${targetUser} was removed`, 'success');
        } catch (err) {
          notify('Failed to remove user', 'error');
        }
      };

      const switchView = (view) => setCurrentView(view);

      const leaveRoom = () => {
        if (!currentRoom || !username) return;
        stopTyping();
        // Switch screens immediately; the presence cleanup finishes in the background.
        db.ref(`roomUsers/${currentRoom}/${username}`).remove().catch(err => addDebugLog(`Leave room error: ${err.message}`, 'error'));
        if (engine.call && engine.call.kind === 'room' && engine.call.roomId === currentRoom) setCallMinimized(true);
        setCurrentRoom(null);
        setCurrentView('lobby');
        setMessages([]);
        setReplyTo(null);
      };

      const deleteRoom = async (roomId, e) => {
        e.stopPropagation();
        const room = rooms.find(r => r.id === roomId);
        if (room && room.owner !== username && username !== 'emmaowner') {
          notify('Only the room owner can delete this room', 'error');
          return;
        }
        if (!confirm('Delete this room and all its messages?')) return;
        try {
          await Promise.all(['rooms', 'messages', 'roomUsers', 'typing', 'kicked', 'gameInvites'].map(k => db.ref(`${k}/${roomId}`).remove()));
          await db.ref(`${CALL_ROOT}/room_${roomId}`).remove();
          notify('Room deleted', 'success');
        } catch (err) {
          notify('Failed to delete room', 'error');
        }
      };

      const validName = (u) => /^[A-Za-z0-9_\-]{3,20}$/.test(u);

      const finishLogin = (u, passHash) => {
        setUsername(u);
        setCurrentView('home');
        setError('');
        setLoginPass('');
        setRegPass('');
        store.set('pr_session', { u, h: passHash });
        markOnline(u);

      const loginAccount = async () => {
        const u = loginUser.trim(), p = loginPass;
        if (!u || !p) { setError('Fill in all fields'); return; }
        try {
          const snap = await db.ref('accounts/' + u).once('value');
          const acc = snap.val();
          if (!acc) { setError('Account not found'); return; }
          const h = await hashAccountPassword(u, p);
          if (acc.passHash) {
            if (acc.passHash !== h) { setError('Wrong password'); return; }
          } else {
            // Old account with a plain-text password: check it, then upgrade to a hash.
            if (acc.password !== p && acc.password !== p.trim()) { setError('Wrong password'); return; }
            await db.ref('accounts/' + u).update({ passHash: h, password: null });
          }
          finishLogin(u, h);
        } catch (e) { setError('Login error: ' + e.message); }
      };

      const registerAccount = async () => {
        const u = regUser.trim(), p = regPass;
        if (!u || !p) { setError('Fill in all fields'); return; }
        if (!validName(u)) { setError('Username: 3–20 letters, numbers, _ or -'); return; }
        if (p.length < 6) { setError('Password must be at least 6 characters'); return; }
        try {
          const snap = await db.ref('accounts/' + u).once('value');
          if (snap.val()) { setError('Username taken'); return; }
          const h = await hashAccountPassword(u, p);
          await db.ref('accounts/' + u).set({ username: u, passHash: h, createdAt: Date.now() });
          finishLogin(u, h);
        } catch (e) { setError('Registration failed: ' + e.message); }
      };

      const sendFriendRequest = async (target) => {
        if (!target || target === username) { setAddFriendMsg('Invalid username'); return; }
        try {
          const snap = await db.ref('accounts/' + target).once('value');
          if (!snap.val()) { setAddFriendMsg('User not found'); return; }
          const already = await db.ref('friends/' + username + '/' + target).once('value');
          if (already.val()) { setAddFriendMsg('Already friends'); return; }
          await db.ref('friendRequests/' + target + '/' + username).set({ from: username, at: Date.now() });
          setAddFriendMsg('Request sent!');
          setAddFriendInput('');
          setTimeout(() => setAddFriendMsg(''), 2500);
        } catch(e) { setAddFriendMsg('Error'); }
      };

      const acceptFriend = async (from) => {
        try {
          await db.ref('friends/' + username + '/' + from).set({ since: Date.now() });

          await db.ref('friendRequests/' + username + '/' + from).remove();
          notify(`You and ${from} are now friends`, 'success');

      };

      const declineFriend = async (from) => {
        try { await db.ref('friendRequests/' + username + '/' + from).remove(); } catch(e) {}

      const removeFriend = async (target) => {
        if (!confirm(`Remove ${target} from your friends?`)) return;

          await db.ref('friends/' + username + '/' + target).remove();

      React.useEffect(() => {

        frRef.on('value', onFr);
        const reqRef = db.ref('friendRequests/' + username);
        let firstReq = true;
        const onReq = snap => {
          const d = snap.val() || {};
          const list = Object.keys(d).map(k => ({ from: k, ...d[k] }));
          setFriendRequests(prev => {
            if (!firstReq && list.length > prev.length) notify(`${list[list.length - 1].from} sent you a friend request`, 'msg', { from: list[list.length - 1].from });
            return list;
          });
          firstReq = false;
        };
        reqRef.on('value', onReq);
        const presRef = db.ref('presence');
        const onPres = snap => { setOnlineUsers(snap.val() || {}); };
        presRef.on('value', onPres);
        return () => { frRef.off('value', onFr); reqRef.off('value', onReq); presRef.off('value', onPres); };

                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

                </button>

if (currentView === 'room') {
